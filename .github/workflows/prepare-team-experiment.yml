name: Prepare team experiment

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

# All experiment runs use one EU2 team.
concurrency:
  group: prepare-team-experiment-eu2
  cancel-in-progress: false
  queue: max

# Exact SDK commit from the preparation command pull request.
env:
  SDK_COMMIT: cc4d767aa24d4831e4e9434e3e53dd384fde7456

jobs:
  prepare-team:
    name: Prepare EU2 team
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/prepare-team-experiment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check SDK pin
        shell: bash
        run: |
          if ! [[ "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SDK commit pin is missing'
            exit 1
          fi
      - name: Check out pinned SDK
        uses: actions/checkout@v4
        with:
          repository: coralogix/coralogix-management-sdk
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
          persist-credentials: false
      - name: Prepare team
        shell: bash
        env:
          CORALOGIX_API_KEY: ${{ secrets.CI_PREP_CORALOGIX_API_KEY }}
          CORALOGIX_SEND_YOUR_DATA_API_KEY: ${{ secrets.CI_PREP_CORALOGIX_SEND_YOUR_DATA_API_KEY }}
          PAGERDUTY_REST_API_KEY: ${{ secrets.CI_PREP_PAGERDUTY_REST_API_KEY }}
          PAGERDUTY_USER_EMAIL: ${{ secrets.CI_PREP_PAGERDUTY_USER_EMAIL }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          for name in CORALOGIX_API_KEY CORALOGIX_SEND_YOUR_DATA_API_KEY PAGERDUTY_REST_API_KEY PAGERDUTY_USER_EMAIL; do
            if [ -z "${!name}" ]; then
              echo 'A preparation secret is missing'
              exit 1
            fi
          done
          if ! docker build --quiet -t prepare-ci-team:experiment sdk/tools/prepare-ci-team >/dev/null 2>&1; then
            echo 'Preparation image build failed'
            exit 1
          fi
          # Do not send command output to the public Actions log.
          if ! docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=32m \
            --cap-drop=ALL --security-opt no-new-privileges \
            -e CORALOGIX_API_KEY \
            -e CORALOGIX_SEND_YOUR_DATA_API_KEY \
            -e PAGERDUTY_REST_API_KEY \
            -e PAGERDUTY_USER_EMAIL \
            prepare-ci-team:experiment >/dev/null 2>&1; then
            echo 'EU2 team preparation failed'
            exit 1
          fi
          echo 'EU2 team preparation passed'

  acceptance:
    name: Focused acceptance (${{ matrix.case }})
    needs: prepare-team
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/prepare-team-experiment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: request-based
            test: TestAccCoralogixResourceSLOV2RequestBased
            integration_field: none
          - case: apm-error
            test: TestAccCoralogixResourceSLOV2APMError
            integration_field: none
          - case: ai-evaluation
            test: TestAccCoralogixResourceAIEvaluation/allowed_topics
            integration_field: none
          # These tests both read PD_INTEGRATION_ID, but need different values.
          - case: pagerduty-one-way
            test: TestAccCoralogixResourcePagerdutyConnector
            integration_field: pagerDutyConnectorKey
          - case: pagerduty-incidents
            test: TestAccCoralogixResourcePagerdutyIncidentsConnector
            integration_field: pagerDutyIntegrationId
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned SDK for integration lookup
        if: ${{ matrix.integration_field != 'none' }}
        uses: actions/checkout@v4
        with:
          repository: coralogix/coralogix-management-sdk
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Run focused acceptance test
        shell: bash
        env:
          CORALOGIX_API_KEY: ${{ secrets.CI_PREP_CORALOGIX_API_KEY }}
          CORALOGIX_ENV: EU2
          CORALOGIX_SLO_V2_APM_SERVICE: ci-acceptance-apm
          TEST_NAME: ${{ matrix.test }}
          INTEGRATION_FIELD: ${{ matrix.integration_field }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "$CORALOGIX_API_KEY" ]; then
            echo 'An acceptance secret is missing'
            exit 1
          fi
          if [ "$INTEGRATION_FIELD" != 'none' ]; then
            private_dir=$(mktemp -d)
            trap 'rm -rf "$private_dir"' EXIT
            if ! PREPARE_CI_TEAM_OUTPUT_FILE="$private_dir/fixtures.json" \
              env -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY -u GITHUB_ENV -u GITHUB_PATH \
              go -C sdk run ./tools/prepare-ci-team lookup >/dev/null 2>&1; then
              echo 'Integration lookup failed'
              exit 1
            fi
            if ! PD_INTEGRATION_ID=$(python3 - "$private_dir/fixtures.json" "$INTEGRATION_FIELD" 2>/dev/null <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              value = json.load(file).get(sys.argv[2])
          if not isinstance(value, str) or not value:
              raise SystemExit(1)
          print(value)
          PY
            ); then
              echo 'Integration lookup output was invalid'
              exit 1
            fi
            export PD_INTEGRATION_ID
          fi
          # Do not give tests access to GitHub's output and summary files.
          if ! TF_ACC=1 env -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY -u GITHUB_ENV -u GITHUB_PATH go test \
            -ldflags '-X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn' \
            ./internal/provider -run "^${TEST_NAME}$" -count=1 -timeout=20m -parallel=1 \
            >/dev/null 2>&1; then
            echo 'Focused acceptance test failed'
            exit 1
          fi
          echo 'Focused acceptance test passed'
