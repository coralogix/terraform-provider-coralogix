# This GitHub action can publish assets for release when a tag is created.
# Currently its setup to run on any tag that matches the pattern "v*" (ie. v0.1.0).
#
# This uses an action (paultyng/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step
# in `goreleaser` to indicate this is being used in a non-interactive mode.
#
name: release
on:
  pull_request:
    paths-ignore:
      - '.claude/**'
      - '.cursor/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/*.md'
  workflow_dispatch:
  # Called by release-provider.yml with the tag it created. GitHub's generated
  # notes become the release body.
  workflow_call:
    inputs:
      tag:
        description: Tag to release, for example v3.22.0.
        required: true
        type: string
  workflow_run:
    workflows: ["semantic-release"]
    types:
      - completed

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # One publishing run at a time, whatever started it, so that two runs for the same tag cannot
    # both pass "Refuse to overwrite a published release" before either has uploaded assets. The
    # second run waits, then finds the assets and stops. A pull request snapshot only builds, so it
    # gets a group of its own and never waits for, or cancels, a release or another snapshot.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('release-snapshot-{0}', github.run_id) || 'release-publish' }}
      cancel-in-progress: false
    # goreleaser publishes a non-draft GitHub release (see .goreleaser.yaml).
    permissions:
      contents: write
    steps:
      - name: Check who released
        # A run started by hand, or by semantic-release, must come from someone listed in
        # .github/RELEASERS on master. release-provider.yml checks before it calls this with a tag.
        if: github.event_name != 'pull_request' && inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          # github.actor started the first run; a re-run keeps it and sets triggering_actor to
          # whoever re-ran. Both must be listed, so a re-run can't pass someone else's run.
          ACTORS: ${{ github.actor }} ${{ github.triggering_actor }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/RELEASERS?ref=master" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/RELEASERS"
          # Not piped into grep -q: under pipefail, grep stopping early can fail sed.
          releasers=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$RUNNER_TEMP/RELEASERS")
          for actor in $ACTORS; do
            if ! grep -qixF "$actor" <<<"$releasers"; then
              echo "::error::$actor is not in .github/RELEASERS; only coralogix/team-eco-system releases"; exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # Empty keeps checkout's default: the commit of the triggering event.
          ref: ${{ inputs.tag || '' }}
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Refuse to overwrite a published release
        # goreleaser uploads into an existing release, so a re-run on a moved tag replaces the
        # assets of a version that registries already ingested (v3.14.1: OpenTofu froze the first
        # checksums and then rejected every install). A tag is released once.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="${TAG_INPUT:-$(git describe --exact-match --tags HEAD 2>/dev/null || true)}"
          if [ -z "$tag" ]; then
            echo "::notice::No tag at this commit; goreleaser decides what to do"; exit 0
          fi
          status=0
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>"$RUNNER_TEMP/release-view.err") || status=$?
          if [ "$status" != 0 ]; then
            if grep -q "release not found" "$RUNNER_TEMP/release-view.err"; then
              echo "No release for $tag yet"; exit 0
            fi
            cat "$RUNNER_TEMP/release-view.err"
            echo "::error::Could not look up the release for $tag"; exit 1
          fi
          if [ "$assets" -gt 0 ]; then
            echo "::error::Release $tag already has $assets assets. Not uploading over them: registries may have recorded their checksums. Release the next patch with 'make bump'. If an earlier run of $tag failed half way and no registry has the version, delete that release and its assets on GitHub, then re-run."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26.x
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v3
        with:
          gpg-private-key: ${{ secrets.PGP_SECRET }}
          passphrase: ${{ secrets.PGP_PASSPHRASE }}
      
      - name: Run GoReleaser (PR – snapshot)
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign

      - name: Generate release notes
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body \
            > "${RUNNER_TEMP}/release-notes.md"

      - name: Run GoReleaser
        if: github.event_name != 'pull_request'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ inputs.tag != '' && format('--release-notes={0}/release-notes.md', runner.temp) || '' }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
