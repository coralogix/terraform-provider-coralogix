# Releases the provider when a merge to master bumps internal/clientset/version.go.
#
# PRs add changelog entries under "# Unreleased". To release, run `make bump` (or
# `make bump BUMP=minor` / `BUMP=major`): it opens a "Release X.Y.Z" PR from master that
# sets the next version and moves those entries under "# Release X.Y.Z". The
# `changelog-check` workflow validates the bump on the PR.
#
# On merge this workflow tags the merge commit, runs goreleaser (release.yml) with
# GitHub's generated notes, and waits until the Terraform Registry serves the version.
# If the Registry never lists it, the run fails; release the next patch with `make bump`.
# A failed job can be re-run from the Actions UI: tagging is idempotent.
#
# approve-release.yml merges release PRs with the Actions token, and a push by that token
# starts no workflow, so it starts this one by workflow_dispatch with the merge commit.
# A release PR merged by a person starts it by push.
name: release-provider

on:
  push:
    branches:
      - master
    paths:
      - internal/clientset/version.go
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on master that bumps internal/clientset/version.go.
        required: true
        type: string

# One release at a time. queue: max keeps every pending run (the default keeps only
# the newest), so a version merged while another is publishing is not skipped.
concurrency:
  group: release-provider
  queue: max

permissions:
  contents: read

jobs:
  tag:
    name: Tag the release
    runs-on: ubuntu-latest
    if: github.repository == 'coralogix/terraform-provider-coralogix'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - id: commit
        name: Find the release commit
        env:
          SHA: ${{ inputs.sha || github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          sha=$(git rev-parse --verify "$SHA^{commit}")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # master has linear history, so master before the merge is the commit's parent.
            if ! git merge-base --is-ancestor "$sha" origin/master; then
              echo "::error::$SHA is not a commit on master"; exit 1
            fi
            before=$(git rev-parse "$sha^")
          else
            before=$PUSH_BEFORE
          fi
          { echo "sha=$sha"; echo "before=$before"; } >> "$GITHUB_OUTPUT"
      - name: Check the bump
        # The same check as on the PR, against master before this merge.
        env:
          BEFORE: ${{ steps.commit.outputs.before }}
        run: python3 .github/scripts/release/release.py check "$BEFORE"
      - id: tag
        name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.commit.outputs.before }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          read_version() { sed -n 's/^const TF_PROVIDER_VERSION = "\(.*\)"$/\1/p'; }
          version=$(read_version < internal/clientset/version.go)
          if [ "$version" = "$(git show "$BEFORE:internal/clientset/version.go" | read_version)" ]; then
            echo "::notice::version.go changed but the version stays $version; nothing to release"
            exit 0
          fi
          tag="v$version"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
          if [ -z "$existing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
            echo "Tagged $SHA as $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$existing" != "$SHA" ]; then
            echo "::error::Tag $tag already exists at $existing, not at $SHA"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  goreleaser:
    name: Build and publish
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  registry:
    name: Wait for the Terraform Registry
    needs: [tag, goreleaser]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Poll the Registry
        run: |
          # The Registry usually lists a new version within 30 minutes. Sometimes it
          # never does; fail then instead of reporting success.
          url="https://registry.terraform.io/v1/providers/coralogix/coralogix/${TAG#v}/download/linux/amd64"
          deadline=$((SECONDS + 60 * 60))
          until curl -fsS -o /dev/null "$url" 2>/dev/null; do
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::The Terraform Registry does not serve $TAG after 60 minutes. Re-run this job to poll again; if it is still missing, release the next patch with \`make bump\`."
              echo "### :x: $TAG is not on the Terraform Registry after 60 minutes" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "$TAG is not on the Registry yet ($(( SECONDS / 60 )) min)"
            sleep 60
          done
          echo "### :white_check_mark: $TAG is on the Terraform Registry" | tee -a "$GITHUB_STEP_SUMMARY"
