name: semantic-release

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #     - master
  #   paths:
  #     - '**/*.go'
  #     - '**/*.tf'
  #     - '**/*.md'
  #     - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coralogix'
    # semantic-release pushes tags, creates releases and comments on the
    # issues/PRs included in the release.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check who released
        # Only someone listed in .github/RELEASERS on master releases.
        env:
          GH_TOKEN: ${{ github.token }}
          # github.actor started the first run; a re-run keeps it and sets triggering_actor to
          # whoever re-ran. Both must be listed, so a re-run can't pass someone else's run.
          ACTORS: ${{ github.actor }} ${{ github.triggering_actor }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/RELEASERS?ref=master" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/RELEASERS"
          for actor in $ACTORS; do
            if ! sed -e 's/#.*//' -e 's/[[:space:]]//g' "$RUNNER_TEMP/RELEASERS" | grep -qixF "$actor"; then
              echo "::error::$actor is not in .github/RELEASERS; only coralogix/team-eco-system releases"; exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release
        uses: cycjimmy/semantic-release-action@v3
        with:
          semantic_version: 19.0.2
          extra_plugins: |
            conventional-changelog-conventionalcommits@4.6.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}