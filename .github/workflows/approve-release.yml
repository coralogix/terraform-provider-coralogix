# Approves and merges the release PRs that `make bump` opens once their CI is green, so that
# a release needs no human review. The merge happens here, after the check, and not by
# auto-merge: auto-merge would merge as soon as anyone approves and the required checks pass,
# while other checks are still running. A merge by the Actions token starts no workflow, so
# this workflow then starts release-provider.yml with the merge commit.
#
# A release PR only versions code that was already reviewed on master. This workflow approves
# one only when its branch is release-X.Y.Z in this repository, its author and the signer of
# each commit are listed in .github/RELEASERS (check-releaser.sh), it changes nothing but
# CHANGELOG.md and the version line in internal/clientset/version.go, X.Y.Z is that new
# version, `release.py check` passes, and every check on the PR's latest commit has passed,
# including the acceptance tests. CODEOWNERS leaves those two files without owners, so this
# approval is the one review the PR needs. Approvals of an older commit are dismissed, so a
# later push is never merged on an old approval. A check that fails or runs again, also a re-run
# after the approval, withdraws it until every check passes.
# A merge that fails also withdraws it. A run is never cancelled once it starts, and a run that
# finds the release PR merged but never released starts release-provider.yml itself; a release
# run that was cancelled or failed stays stopped until a person restarts it.
# check-ci.sh runs again right before the merge, and a re-run starts this workflow when it is
# requested, so a check re-run after the approval holds the merge: master requires only
# "Acceptance tests result".
#
# It runs when the release PR changes (to dismiss stale approvals) and whenever a PR workflow
# finishes (to approve once the last check passes). Both triggers run this file and release.py
# as they are on master, never a copy that the PR changed. The PR's files are only read.
name: approve-release

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
  workflow_run:
    workflows: ["Acceptance Tests", "build", "release", "changelog-check", "tfsec"]
    # requested too: a re-run after the approval withdraws it as soon as it starts.
    types: [requested, completed]

permissions:
  contents: read

jobs:
  approve:
    # Check runs named "Release PR: ..." are this workflow's own and are not waited for.
    name: "Release PR: approve"
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target' &&
       startsWith(github.head_ref, 'release-') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'release-') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: approve-release-${{ github.head_ref || github.event.workflow_run.head_branch }}
      # Never cancel a running job: one cancelled between merging the PR and starting
      # release-provider.yml would leave the version merged but not released. A newer event
      # replaces only a pending run, and the job doesn't wait for CI, so runs stay short.
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Keep master's scripts
        # Later steps check out the PR head; the scripts that judge it must stay master's.
        run: cp .github/scripts/release/release.py .github/scripts/release/check-ci.sh "$RUNNER_TEMP/"
      - id: pr
        name: Find the release PR
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --base master --state open \
            --json number,headRefOid,isDraft --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "::notice::No open PR from $HEAD_REF"; exit 0; fi
          jq -r '"number=\(.number)\nsha=\(.headRefOid)\ndraft=\(.isDraft)"' <<<"$pr" >> "$GITHUB_OUTPUT"
      - name: Start a release that a merge left behind
        # If a run merged the release PR and stopped before starting release-provider.yml, the merge
        # commit has no tag and no release run. A merge by the Actions token starts no push
        # workflow, so nothing else would release it.
        if: steps.pr.outputs.number == ''
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --base master --state merged \
            --json mergeCommit,mergedAt --jq '.[0] // empty | "\(.mergeCommit.oid) \(.mergedAt)"')
          if [ -z "$pr" ]; then exit 0; fi
          read -r merged merged_at <<<"$pr"
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/internal/clientset/version.go?ref=$merged" \
            -H "Accept: application/vnd.github.raw" | sed -n 's/^const TF_PROVIDER_VERSION = "\(.*\)"$/\1/p')
          if [ -z "$version" ]; then echo "::error::No version in internal/clientset/version.go at $merged"; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then exit 0; fi
          # Only a merge that never got a release run is started here. Any run of this merge commit,
          # also a cancelled or failed one, leaves the release to a person: someone may have stopped
          # it on purpose. A run of another version doesn't count. Every run since the merge is read,
          # not the newest few: a run of this merge can't be older than the merge.
          runs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release-provider.yml/runs?created=%3E%3D$merged_at&per_page=100" \
            --jq ".workflow_runs[] | select(.display_title | endswith(\" $merged\")) | .id" | wc -l | tr -d ' ')
          if [ "$runs" != "0" ]; then
            echo "::notice::v$version is not tagged yet, but release-provider.yml already ran for $merged. Re-run or start it from the Actions tab to release it."; exit 0
          fi
          gh workflow run release-provider.yml --repo "$GITHUB_REPOSITORY" --ref master -f sha="$merged"
          echo "Started release-provider.yml for $merged (v$version), which a merge left without a release" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dismiss approvals of older commits
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id != \"$HEAD_SHA\") | .id" |
            while read -r id; do
              gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$id/dismissals" \
                -f message="Superseded by a new push; re-checking the release PR." -f event=DISMISS >/dev/null
            done
      - name: Check who opened the release PR
        # Before the PR head is checked out, so the script comes from master.
        if: steps.pr.outputs.number != '' && steps.pr.outputs.draft == 'false'
        env:
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: .github/scripts/release/check-releaser.sh "$PR"
      - name: Check the release PR
        if: steps.pr.outputs.number != '' && steps.pr.outputs.draft == 'false'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          git fetch --quiet --no-tags origin "$HEAD_SHA"
          git checkout --quiet --detach "$HEAD_SHA"
          version_of() { sed -n 's/^const TF_PROVIDER_VERSION = "\(.*\)"$/\1/p'; }
          files=$(git diff --name-only origin/master...HEAD | sort | tr '\n' ' ')
          if [ "$files" != "CHANGELOG.md internal/clientset/version.go " ]; then
            echo "::error::A release PR changes only CHANGELOG.md and internal/clientset/version.go; this one changes: $files"; exit 1
          fi
          if [ "$(git diff --numstat origin/master...HEAD -- internal/clientset/version.go | cut -f1,2)" != "$(printf '1\t1')" ]; then
            echo "::error::A release PR changes only the version line of internal/clientset/version.go"; exit 1
          fi
          version=$(version_of < internal/clientset/version.go)
          if [ "$HEAD_REF" != "release-$version" ]; then
            echo "::error::Branch $HEAD_REF does not match version $version; open release PRs with \`make bump\`"; exit 1
          fi
          python3 -I "$RUNNER_TEMP/release.py" check origin/master
      - id: ci
        name: Wait for green CI
        if: steps.pr.outputs.number != '' && steps.pr.outputs.draft == 'false'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # Until every check has passed, CI is not green, also when a check is re-run after the
          # approval; the bot's approval is then withdrawn below and given again once all pass.
          if "$RUNNER_TEMP/check-ci.sh" "$HEAD_SHA"; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi
      - id: current
        name: Check against current master
        if: steps.ci.outputs.green == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # master may have moved since CI checked the PR. Check the PR merged into master as it
          # is now, the way version-bump checks the PR's merge commit, so a feature that merged
          # meanwhile can't leave an unchecked changelog on master. This runs before the approval:
          # the two release files have no CODEOWNER, so an approval lets anyone merge by hand.
          git fetch --quiet --no-tags origin master
          base=$(git rev-parse origin/master)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if ! git -c user.name=approve-release -c user.email=approve-release@localhost \
              merge --quiet --no-edit --no-ff origin/master; then
            echo "::error::Release PR #$PR conflicts with master. Close it, delete its branch, and run \`make bump\` again."; exit 1
          fi
          python3 -I "$RUNNER_TEMP/release.py" check "$base"
      - name: Approve
        if: steps.ci.outputs.green == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          approved=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\")] | length")
          if [ "$approved" != "0" ]; then echo "Already approved $HEAD_SHA"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" -f commit_id="$HEAD_SHA" -f event=APPROVE \
            -f body="Release PR from \`make bump\`: only the version and changelog change, the release check passes, and CI is green." >/dev/null
          echo "Approved $HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Merge and release
        if: steps.ci.outputs.green == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          BASE: ${{ steps.current.outputs.base }}
        run: |
          # A check re-run since the CI step above holds the merge, and the approval is withdrawn
          # below. master requires only "Acceptance tests result", so GitHub wouldn't wait for it.
          if ! "$RUNNER_TEMP/check-ci.sh" "$HEAD_SHA"; then
            echo "::error::A check on #$PR changed after the approval; the approval is withdrawn until every check passes again."; exit 1
          fi
          # GitHub can't merge against an expected base: --match-head-commit pins only the PR head.
          # So right before merging, check the PR again against master as it is now, until master
          # holds still, which leaves only the merge call itself between check and merge.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --no-tags origin master
            now=$(git rev-parse origin/master)
            if [ "$now" = "$BASE" ]; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::master keeps moving; not merging #$PR. The next CI event retries."; exit 1; fi
            echo "master moved from $BASE to $now since the check; checking again"
            git checkout --quiet --detach "$HEAD_SHA"
            if ! git -c user.name=approve-release -c user.email=approve-release@localhost \
                merge --quiet --no-edit --no-ff origin/master; then
              echo "::error::Release PR #$PR conflicts with master. Close it, delete its branch, and run \`make bump\` again."; exit 1
            fi
            python3 -I "$RUNNER_TEMP/release.py" check "$now"
            BASE=$now
          done
          # --match-head-commit refuses to merge if the branch moved after the checks above.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
          merged=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid // empty')
          if [ -z "$merged" ]; then echo "::error::PR #$PR has no merge commit after merging"; exit 1; fi
          # If master moved during the merge call itself, release-provider.yml repeats the check
          # against the real parent before tagging.
          parent=$(gh api "repos/$GITHUB_REPOSITORY/commits/$merged" --jq '.parents[0].sha')
          if [ "$parent" != "$BASE" ]; then
            echo "::warning::master moved from $BASE to $parent while merging; release-provider.yml re-checks before tagging."
          fi
          if ! gh workflow run release-provider.yml --repo "$GITHUB_REPOSITORY" --ref master -f sha="$merged"; then
            echo "::error::Merged #$PR as $merged but could not start release-provider.yml. Run it from the Actions tab with sha $merged."; exit 1
          fi
          echo "Merged #$PR as $merged; started release-provider.yml" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dismiss the approval
        # A failed step, or CI that is not green (a check failed or is running again), withdraws
        # the bot's approval of a PR that is still open: one given by this run before the merge
        # failed, or by an earlier run, for example before master gained changelog entries that
        # this PR does not release, or before a re-run failed.
        if: >-
          steps.pr.outputs.number != '' &&
          (failure() || cancelled() || steps.ci.outputs.green == 'false')
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != OPEN ]; then echo "PR #$PR is $state; nothing to withdraw"; exit 0; fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' |
            while read -r id; do
              gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$id/dismissals" \
                -f message="The release PR no longer passes its checks; approval follows when they pass again." -f event=DISMISS >/dev/null
            done
