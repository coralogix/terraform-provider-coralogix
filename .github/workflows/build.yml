name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    env:
      GO111MODULE: on
    strategy:
      matrix:
        go-version: [ 1.26.x ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run build
        run: make build

  test:
    name: Unit tests
    permissions:
      contents: read
    env:
      GO111MODULE: on
    strategy:
      matrix:
        go-version: [ 1.26.x ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run unit tests
        run: make test

  iac-codegen:
    name: IaC generator
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: 1.26.x
      - name: Test generator
        working-directory: tools/iac-codegen
        run: |
          go test ./...
          go vet ./...
      - name: Test generator version check
        run: bash tools/iac-codegen/scripts/check-version-change_test.sh
      - name: Require generator version change
        if: github.event_name == 'pull_request'
        run: tools/iac-codegen/scripts/check-version-change.sh '${{ github.event.pull_request.base.sha }}'
