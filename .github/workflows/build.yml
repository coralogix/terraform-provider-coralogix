name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    env:
      GO111MODULE: on
    strategy:
      matrix:
        go-version: [ 1.26.x ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run build
        run: make build
      - name: Build the test resource cleanup
        # The build tag keeps the nightly cleanup script out of `go build ./...`, so an SDK change
        # can break it without failing the build above.
        run: go build -o /dev/null scripts/cx-test-resource-cleanup.go

  test:
    name: Unit tests
    permissions:
      contents: read
    env:
      GO111MODULE: on
    strategy:
      matrix:
        go-version: [ 1.26.x ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run unit tests
        run: make test

  alert-baseline:
    name: Alert baseline tests
    permissions:
      contents: read
    env:
      GO111MODULE: on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: 1.26.x
      - name: Run the alert baseline tests
        # The modules must be downloaded first: the fake reads the OpenAPI document from the module cache.
        run: |
          go mod download
          make test-alert-baseline

  test-dashboard-baseline:
    # The dashboard baseline tests run here, next to the unit tests, with a longer limit.
    name: Dashboard baseline tests
    permissions:
      contents: read
    env:
      GO111MODULE: on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: 1.26.x
      - name: Run dashboard baseline tests
        run: make test-dashboard-baseline

  test-dashboard-walk:
    # The schema walk of all 46 bases, in four jobs of about the same run time.
    name: Dashboard walk (shard ${{ matrix.shard }} of 4)
    permissions:
      contents: read
    env:
      GO111MODULE: on
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: 1.26.x
      - name: Walk the shard
        run: make test-dashboard-walk SHARD=${{ matrix.shard }}

  iac-codegen:
    name: IaC generator
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@37335c7bb261b353407cff977110895fa0b4f7d8
        with:
          go-version: 1.26.x
      - name: Download Go modules
        # A generator test renders a released resource from the pinned SDK contract.
        # The SDK check loads internal/clientset with GOPROXY=off, so every module
        # of the root go.mod must be in the module cache first.
        run: go mod download
      - name: Setup Terraform
        # A runtime semantics test runs a generated resource with real Terraform. Without a CLI on
        # the runner, terraform-plugin-testing downloads one and fails on an expired signing key.
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Test generator
        working-directory: tools/iac-codegen
        run: |
          go test ./...
          go vet ./...
      - name: Test generator version check
        run: bash tools/iac-codegen/scripts/check-version-change_test.sh
      - name: Test generated resources check
        run: bash tools/iac-codegen/scripts/check-generated-resources_test.sh
      - name: Test changelog entry script
        run: bash tools/iac-codegen/scripts/add-changelog-entry_test.sh
      - name: Test auto-regenerate list check
        run: bash tools/iac-codegen/scripts/check-auto-regenerate-list_test.sh
      - name: Test SDK ref resolution
        run: bash tools/iac-codegen/scripts/resolve-sdk-ref_test.sh
      - name: Test schema change classification
        run: bash tools/iac-codegen/scripts/schema-changes_test.sh
      - name: Require generated resources in the auto-regenerate list
        run: tools/iac-codegen/scripts/check-auto-regenerate-list.sh > /dev/null
      - name: Require generator version change
        if: github.event_name == 'pull_request'
        run: tools/iac-codegen/scripts/check-version-change.sh '${{ github.event.pull_request.base.sha }}'
      - name: Require current generated resources
        if: github.event_name == 'pull_request'
        run: bash tools/iac-codegen/scripts/check-generated-resources.sh
