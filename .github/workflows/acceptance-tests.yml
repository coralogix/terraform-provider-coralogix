name: Acceptance Tests

on:
  schedule:
    - cron: 20 1 * * *
  push:
    branches:
      - master
  # No paths-ignore: branch protection requires the `Acceptance tests result` job,
  # so the workflow must start on every pull request. The `changes` job skips the
  # tests for pull requests that change only docs and agent files.
  pull_request:
    branches:
      - master

concurrency:
  # One shared group for all live acceptance runs (any PR, master push, or nightly).
  # Per-PR/ref groups allow overlapping jobs on the same Coralogix team; tests that
  # overwrite team-wide state (TCO, archive logs/metrics, quota) then race.
  group: acceptance-tests-live-cx
  # Live suites create remote Coralogix resources and clean them up on teardown.
  # Cancelling mid-run can leak fixtures in the shared team.
  cancel-in-progress: false
  # The default `queue: single` keeps one pending run and cancels it when a newer
  # run joins the group. `max` keeps up to 100 pending runs in FIFO order.
  queue: max

env:
  DASHBOARD_ACC_PATTERN: '^TestAccCoralogix(Resource|DataSource)Dashboards?'
  DASHBOARD_MIGRATION_ACC_PATTERN: '^TestAccCoralogixResourceDashboardMigration'
  DASHBOARD_MIGRATION_V360_PATTERN: &dashboard_migration_v360_pattern '^TestAccCoralogixResourceDashboardMigrationFromV360$'
  DASHBOARD_MIGRATION_SCHEMA_V3_PATTERN: &dashboard_migration_schema_v3_pattern '^TestAccCoralogixResourceDashboardMigrationFromSchemaV3$'
  DASHBOARD_MIGRATION_SAME_SCHEMA_VERSION_PATTERN: &dashboard_migration_same_schema_version_pattern '^TestAccCoralogixResourceDashboardMigrationFromSameSchemaVersion$'
  EVENTS2METRIC_MIGRATION_ACC_PATTERN: &events2metric_migration_acc_pattern '^TestAccCoralogixResourceEvents2MetricMigration$'
  USER_MIGRATION_ACC_PATTERN: &user_migration_acc_pattern '^TestAccCoralogixResourceUserMigration'
  GLOBAL_ROUTER_MIGRATION_ACC_PATTERN: &global_router_migration_acc_pattern '^TestAccCoralogixResourceGlobalRouterMigration$'
  # Every generated resource has a test whose name ends in GeneratedUpgrade. One shard runs them all.
  GENERATED_UPGRADE_ACC_PATTERN: &generated_upgrade_acc_pattern 'GeneratedUpgrade$'
  # The archive logs target is one per company, so its tests must not run at the same time. The
  # archive-logs shard runs all of them (handwritten, generated, and generated upgrade) with -p 1;
  # every other job skips them.
  ARCHIVE_LOGS_ACC_PATTERN: &archive_logs_acc_pattern '^TestAccCoralogix(Resource|DataSource)(Resource)?ArchiveLogs'
  # The quota allocation rule set is one per account, so its tests must not run at the same time. The
  # quota-allocation-rule-set shard runs all of them (handwritten, generated, and generated upgrade)
  # with -p 1; every other job skips them.
  QUOTA_ACC_PATTERN: &quota_acc_pattern '^TestAccCoralogix(Resource|DataSource)QuotaAllocation'
  # The generated upgrade shard leaves out the tests that have a shard of their own.
  GENERATED_UPGRADE_SKIP_PATTERN: &generated_upgrade_skip_pattern '^TestAccCoralogix(Resource|DataSource)(Resource)?ArchiveLogs|^TestAccCoralogix(Resource|DataSource)QuotaAllocation'
  DASHBOARD_SHARD_STRUCTURED_LINE_AND_TABLE: &dashboard_shard_structured_line_and_table '^TestAccCoralogixResourceDashboardOpenAPIWidget(Logs|Metrics|Spans|DataPrime)Queries$/line-and-table$'
  DASHBOARD_SHARD_STRUCTURED_GAUGE_AND_BARS: &dashboard_shard_structured_gauge_and_bars '^TestAccCoralogixResourceDashboardOpenAPIWidget(Logs|Metrics|Spans|DataPrime)Queries$/gauge-and-bars$'
  DASHBOARD_SHARD_STRUCTURED_HORIZONTAL_AND_HEXAGON: &dashboard_shard_structured_horizontal_and_hexagon '^TestAccCoralogixResourceDashboardOpenAPIWidget(Logs|Metrics|Spans|DataPrime)Queries$/horizontal-and-hexagon$'
  DASHBOARD_SHARD_PRESENTATION_RESOLUTION_AND_TIME_FRAMES: &dashboard_shard_presentation_resolution_and_time_frames '^TestAccCoralogixResourceDashboardOpenAPINestedPresentationBranches$/resolution-and-time-frames$'
  DASHBOARD_SHARD_PRESENTATION_BAR_CHART_AXES: &dashboard_shard_presentation_bar_chart_axes '^TestAccCoralogixResourceDashboardOpenAPINestedPresentationBranches$/bar-chart-axes$'
  DASHBOARD_SHARD_PRESENTATION_HORIZONTAL_BAR_OPTIONS: &dashboard_shard_presentation_horizontal_bar_options '^TestAccCoralogixResourceDashboardOpenAPINestedPresentationBranches$/horizontal-bar-options$'
  DASHBOARD_SHARD_PRESENTATION_COLORS_BY_BRANCHES: &dashboard_shard_presentation_colors_by_branches '^TestAccCoralogixResourceDashboardOpenAPINestedPresentationBranches$/colors-by-branches$'
  DASHBOARD_SHARD_OPENAPI_BRANCHES: &dashboard_shard_openapi_branches '^TestAccCoralogixResourceDashboardOpenAPI(OneOfTransitions|LogsAggregationBranches|SpansAndFilterBranches|VariableBranches|AnnotationBranches)$'
  DASHBOARD_SHARD_CORE: &dashboard_shard_core '^TestAccCoralogix(DataSourceDashboard(_basic|AccessPolicy)|DataSourceDashboardsFolder_(basic|by_name)|ResourceDashboardsFolder|ResourceDashboard(ContentJSON(ProtobufSpellings|FolderOverride|DynamicQueriesTable)|RESTCreated(Hydration|UnsupportedDynamicHydration)|AccessPolicy|HexagonWidget|LinechartWidget|GaugeWidget(DataPrime|ThresholdType)?|DataTableWidget(ObservationFieldFilter)?|FromJson(WithFolder|WithVar)?|FolderIDNoDrift|MultiSelectSelectionType|LayoutColor|ManualAnnotation)?)$'
  DASHBOARD_SHARD_DYNAMIC_TIME_SERIES_AND_SPATIAL: &dashboard_shard_dynamic_time_series_and_spatial '^TestAccCoralogixResourceDashboardDynamic(TimeSeriesWidgets|SpatialWidgets)$'
  DASHBOARD_SHARD_DYNAMIC_STAT: &dashboard_shard_dynamic_stat '^TestAccCoralogixResourceDashboardDynamic(StatWidget|StatCardWidget)$'
  DASHBOARD_SHARD_DYNAMIC_BARS_TABLE_AND_GAUGE: &dashboard_shard_dynamic_bars_table_and_gauge '^TestAccCoralogixResourceDashboardDynamic(BarsWidgets|TableWidget|GaugeAndPieWidgets)$'
  DASHBOARD_SHARD_HASH_COLORS_AND_COLORS_BY: &dashboard_shard_hash_colors_and_colors_by '^TestAccCoralogixResourceDashboard(HashColors|ColorsBy)$'
  DASHBOARD_SHARD_PARITY_FIELDS: &dashboard_shard_parity_fields '^TestAccCoralogixResourceDashboard(LineChart|BarChart|Gauge|PieChart)ParityFields$'
  DASHBOARD_SHARD_ACTIONS_SECTIONS_AND_ANNOTATIONS: &dashboard_shard_actions_sections_and_annotations '^TestAccCoralogixResourceDashboard(WidgetCustomActions|SectionOptionBranches|AccessPolicyAddedLater|MetricAnnotationOrientation|AnnotationScope|DataprimeAnnotation|EventRecurrenceAnnotation)$'
  DASHBOARD_SHARD_VARIABLES_V2: &dashboard_shard_variables_v2 '^TestAccCoralogixResourceDashboardVariablesV2'
  # Together these two match what the old alerts-and-integrations shard matched. A test that
  # matches both, such as TestAccCoralogixAlertWebhooksNotifyOnMandatory, is an alert test: the
  # notification-center shard skips the alerts pattern.
  NON_DASHBOARD_SHARD_ALERTS_AND_SCHEDULER: &non_dashboard_shard_alerts_and_scheduler '^TestAccCoralogix.*Alert'
  NON_DASHBOARD_SHARD_NOTIFICATION_CENTER: &non_dashboard_shard_notification_center '^TestAccCoralogix.*(Webhook|Connector|Preset|Integration)'
  NON_DASHBOARD_SHARD_DATA_PROCESSING: &non_dashboard_shard_data_processing '^TestAccCoralogix.*(ParsingRules|Enrichments?|DataSet|TCOPolicies)'
  # The user tests run one after another and are the slowest non-dashboard tests.
  # Three shards keep each job near three minutes.
  # Tests that change team-wide state (archives, global router, IP access) stay
  # together in the catch-all, so they still run one after another.
  NON_DASHBOARD_SHARD_USER_GROUP_MEMBERSHIP: &non_dashboard_shard_user_group_membership '^TestAccCoralogixResourceUserGroupMembership$'
  NON_DASHBOARD_SHARD_USER_DATA_SOURCE: &non_dashboard_shard_user_data_source '^TestAccCoralogixDataSourceUser'
  NON_DASHBOARD_SHARD_USER_RESOURCE: &non_dashboard_shard_user_resource '^TestAccCoralogixResourceUser(|CreateInactive|KeepsLoginModes|BackwardsCompatibility|OutOfBandDeactivation|DestroyWhenAlreadyInactive)$'
  NON_DASHBOARD_SHARD_ACCESS_CONTROL: &non_dashboard_shard_access_control '^Test(AccCoralogix(Resource|DataSource)(CustomRole|ApiKey|Group|Scope)|ApiKeyResource|CustomRole)'
  NON_DASHBOARD_SHARD_SLO_AI_VIEWS_AND_RECORDING_RULES: &non_dashboard_shard_slo_ai_views_and_recording_rules '^TestAccCoralogix((Resource|DataSource)(SLOV2|AI|ViewFolder)|(DataSource)?RecordingRules)'

jobs:
  changes:
    name: Detect code changes
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check for files other than docs and agent files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed API call stops the job here. The result job then fails,
          # so an error can never skip the tests and report success.
          # A renamed file lists its old path in previous_filename. Check both, so
          # moving code to a docs path still counts as a code change.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          # A here-string, not a pipe: `grep -q` exits at the first match, and
          # under pipefail the writer's SIGPIPE would make this check false.
          if grep -qvE '^(\.claude/|\.cursor/)|\.md$' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Non-dashboard acceptance tests (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    env:
      GO111MODULE: on
      FAILED_TESTS_FILE: failed-tests/non-dashboard-${{ matrix.shard }}.txt
      RAN_TESTS_FILE: ran-tests/non-dashboard-${{ matrix.shard }}.txt
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: alerts-and-scheduler
            pattern: *non_dashboard_shard_alerts_and_scheduler
          - shard: notification-center
            pattern: *non_dashboard_shard_notification_center
            skip: *non_dashboard_shard_alerts_and_scheduler
          - shard: data-processing
            pattern: *non_dashboard_shard_data_processing
          - shard: user-group-membership
            pattern: *non_dashboard_shard_user_group_membership
          - shard: user-data-source
            pattern: *non_dashboard_shard_user_data_source
          - shard: user-resource
            pattern: *non_dashboard_shard_user_resource
          - shard: access-control
            pattern: *non_dashboard_shard_access_control
          - shard: slo-ai-views-and-recording-rules
            pattern: *non_dashboard_shard_slo_ai_views_and_recording_rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Non-Dashboard Acceptance Tests
        env:
          CORALOGIX_ENV: ${{ secrets.CORALOGIX_ENV }}
          CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
          TEST_TEAM_ID: ${{ secrets.TEST_TEAM_ID }}          
          AWS_TEST_ROLE: ${{ secrets.AWS_TEST_ROLE }}
          ARCHIVE_LOGS_BUCKET: ${{ secrets.ARCHIVE_LOGS_BUCKET }}
          ARCHIVE_METRICS_BUCKET: ${{ secrets.ARCHIVE_METRICS_BUCKET }}
          SLACK_INTEGRATION_ID: ${{ secrets.SLACK_INTEGRATION_ID }}
          SLACK_INTEGRATION_CHANNEL: ${{ secrets.SLACK_INTEGRATION_CHANNEL }}
          SLACK_INTEGRATION_CHANNEL_UPDATED: ${{ secrets.SLACK_INTEGRATION_CHANNEL_UPDATED }}
          PD_INTEGRATION_ID: ${{ secrets.PD_INTEGRATION_ID }}
          CORALOGIX_SLO_V2_APM_SERVICE: ${{ secrets.CORALOGIX_SLO_V2_APM_SERVICE }}
          RUN_PATTERN: ${{ matrix.pattern }}
          # The Makefile passes it to -skip. Empty for a shard without a skip pattern.
          ACC_SKIP_PATTERN: ${{ matrix.skip }}
        run: |
          # make reads `$` as a variable, so a pattern that ends in `$'` lost its
          # closing quote. `$$` reaches the shell as one `$`.
          bash .github/scripts/run-tests-with-summary.sh make testacc "TESTARGS=-run '${RUN_PATTERN//\$/\$\$}'"
      # Uploads on pass too (an empty file) and overwrites the earlier attempt,
      # so after any re-run each shard has one file for its latest result.
      - name: Upload failed test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-non-dashboard-${{ matrix.shard }}
          path: ${{ env.FAILED_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      # No attempt number in the name: a re-run replaces the file of its own job
      # and keeps the files of jobs that did not re-run, so the check sees every job.
      - name: Upload ran test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ran-tests-non-dashboard-${{ matrix.shard }}
          path: ${{ env.RAN_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  test-unsharded:
    name: Non-dashboard acceptance tests (unsharded catch-all)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    env:
      GO111MODULE: on
      FAILED_TESTS_FILE: failed-tests/non-dashboard-unsharded.txt
      RAN_TESTS_FILE: ran-tests/non-dashboard-unsharded.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Non-Dashboard Acceptance Tests Not Covered By A Shard
        env:
          CORALOGIX_ENV: ${{ secrets.CORALOGIX_ENV }}
          CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
          TEST_TEAM_ID: ${{ secrets.TEST_TEAM_ID }}
          AWS_TEST_ROLE: ${{ secrets.AWS_TEST_ROLE }}
          ARCHIVE_LOGS_BUCKET: ${{ secrets.ARCHIVE_LOGS_BUCKET }}
          ARCHIVE_METRICS_BUCKET: ${{ secrets.ARCHIVE_METRICS_BUCKET }}
          SLACK_INTEGRATION_ID: ${{ secrets.SLACK_INTEGRATION_ID }}
          SLACK_INTEGRATION_CHANNEL: ${{ secrets.SLACK_INTEGRATION_CHANNEL }}
          SLACK_INTEGRATION_CHANNEL_UPDATED: ${{ secrets.SLACK_INTEGRATION_CHANNEL_UPDATED }}
          PD_INTEGRATION_ID: ${{ secrets.PD_INTEGRATION_ID }}
          CORALOGIX_SLO_V2_APM_SERVICE: ${{ secrets.CORALOGIX_SLO_V2_APM_SERVICE }}
        run: |
          shard_patterns=(
            "$NON_DASHBOARD_SHARD_ALERTS_AND_SCHEDULER"
            "$NON_DASHBOARD_SHARD_NOTIFICATION_CENTER"
            "$NON_DASHBOARD_SHARD_DATA_PROCESSING"
            "$NON_DASHBOARD_SHARD_USER_GROUP_MEMBERSHIP"
            "$NON_DASHBOARD_SHARD_USER_DATA_SOURCE"
            "$NON_DASHBOARD_SHARD_USER_RESOURCE"
            "$NON_DASHBOARD_SHARD_ACCESS_CONTROL"
            "$NON_DASHBOARD_SHARD_SLO_AI_VIEWS_AND_RECORDING_RULES"
          )
          skip_pattern="$DASHBOARD_ACC_PATTERN|$EVENTS2METRIC_MIGRATION_ACC_PATTERN|$USER_MIGRATION_ACC_PATTERN|$ARCHIVE_LOGS_ACC_PATTERN|$QUOTA_ACC_PATTERN"
          for pattern in "${shard_patterns[@]}"; do
            skip_pattern+="|($pattern)"
          done
          ACC_SKIP_PATTERN="$skip_pattern" bash .github/scripts/run-tests-with-summary.sh make testacc
      # Uploads on pass too (an empty file) and overwrites the earlier attempt,
      # so after any re-run each shard has one file for its latest result.
      - name: Upload failed test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-non-dashboard-unsharded
          path: ${{ env.FAILED_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      # No attempt number in the name: a re-run replaces the file of its own job
      # and keeps the files of jobs that did not re-run, so the check sees every job.
      - name: Upload ran test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ran-tests-non-dashboard-unsharded
          path: ${{ env.RAN_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  dashboard:
    name: Dashboard acceptance tests (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    env:
      GO111MODULE: on
      FAILED_TESTS_FILE: failed-tests/dashboard-${{ matrix.shard }}.txt
      RAN_TESTS_FILE: ran-tests/dashboard-${{ matrix.shard }}.txt
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: structured-line-and-table
            pattern: *dashboard_shard_structured_line_and_table
          - shard: structured-gauge-and-bars
            pattern: *dashboard_shard_structured_gauge_and_bars
          - shard: structured-horizontal-and-hexagon
            pattern: *dashboard_shard_structured_horizontal_and_hexagon
          - shard: presentation-resolution-and-time-frames
            pattern: *dashboard_shard_presentation_resolution_and_time_frames
          - shard: presentation-bar-chart-axes
            pattern: *dashboard_shard_presentation_bar_chart_axes
          - shard: presentation-horizontal-bar-options
            pattern: *dashboard_shard_presentation_horizontal_bar_options
          - shard: presentation-colors-by-branches
            pattern: *dashboard_shard_presentation_colors_by_branches
          - shard: openapi-branches
            pattern: *dashboard_shard_openapi_branches
          - shard: core
            pattern: *dashboard_shard_core
          - shard: dynamic-time-series-and-spatial
            pattern: *dashboard_shard_dynamic_time_series_and_spatial
          - shard: dynamic-stat
            pattern: *dashboard_shard_dynamic_stat
          - shard: dynamic-bars-table-and-gauge
            pattern: *dashboard_shard_dynamic_bars_table_and_gauge
          - shard: hash-colors-and-colors-by
            pattern: *dashboard_shard_hash_colors_and_colors_by
          - shard: parity-fields
            pattern: *dashboard_shard_parity_fields
          - shard: actions-sections-and-annotations
            pattern: *dashboard_shard_actions_sections_and_annotations
          - shard: variables-v2
            pattern: *dashboard_shard_variables_v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Dashboard Acceptance Tests
        env:
          CORALOGIX_ENV: ${{ secrets.CORALOGIX_ENV }}
          CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
        run: |
          # All provider packages, not only ./internal/provider: the non-dashboard jobs skip
          # dashboard names in every package, so a generated dashboard resource in its own
          # package must be picked up here.
          bash .github/scripts/run-tests-with-summary.sh env TF_ACC=1 go test -ldflags "-X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn" ./internal/provider/... -v -run '${{ matrix.pattern }}' -timeout 120m -parallel=4
      # Uploads on pass too (an empty file) and overwrites the earlier attempt,
      # so after any re-run each shard has one file for its latest result.
      - name: Upload failed test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-dashboard-${{ matrix.shard }}
          path: ${{ env.FAILED_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      # No attempt number in the name: a re-run replaces the file of its own job
      # and keeps the files of jobs that did not re-run, so the check sees every job.
      - name: Upload ran test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ran-tests-dashboard-${{ matrix.shard }}
          path: ${{ env.RAN_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  dashboard-unsharded:
    name: Dashboard acceptance tests (unsharded catch-all)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    env:
      GO111MODULE: on
      FAILED_TESTS_FILE: failed-tests/dashboard-unsharded.txt
      RAN_TESTS_FILE: ran-tests/dashboard-unsharded.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Dashboard Acceptance Tests Not Covered By A Shard
        env:
          CORALOGIX_ENV: ${{ secrets.CORALOGIX_ENV }}
          CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
        run: |
          shard_patterns=(
            "$DASHBOARD_SHARD_STRUCTURED_LINE_AND_TABLE"
            "$DASHBOARD_SHARD_STRUCTURED_GAUGE_AND_BARS"
            "$DASHBOARD_SHARD_STRUCTURED_HORIZONTAL_AND_HEXAGON"
            "$DASHBOARD_SHARD_PRESENTATION_RESOLUTION_AND_TIME_FRAMES"
            "$DASHBOARD_SHARD_PRESENTATION_BAR_CHART_AXES"
            "$DASHBOARD_SHARD_PRESENTATION_HORIZONTAL_BAR_OPTIONS"
            "$DASHBOARD_SHARD_PRESENTATION_COLORS_BY_BRANCHES"
            "$DASHBOARD_SHARD_OPENAPI_BRANCHES"
            "$DASHBOARD_SHARD_CORE"
            "$DASHBOARD_SHARD_DYNAMIC_TIME_SERIES_AND_SPATIAL"
            "$DASHBOARD_SHARD_DYNAMIC_STAT"
            "$DASHBOARD_SHARD_DYNAMIC_BARS_TABLE_AND_GAUGE"
            "$DASHBOARD_SHARD_HASH_COLORS_AND_COLORS_BY"
            "$DASHBOARD_SHARD_PARITY_FIELDS"
            "$DASHBOARD_SHARD_ACTIONS_SECTIONS_AND_ANNOTATIONS"
            "$DASHBOARD_SHARD_VARIABLES_V2"
          )
          skip_pattern="($DASHBOARD_MIGRATION_ACC_PATTERN)"
          for pattern in "${shard_patterns[@]}"; do
            # Keep each slash unbracketed. Go uses it as the separator between
            # a parent test pattern and a subtest pattern.
            skip_pattern+="|$pattern"
          done
          # All provider packages, not only ./internal/provider: the non-dashboard jobs skip
          # dashboard names in every package, so a generated dashboard resource in its own
          # package must be picked up here.
          bash .github/scripts/run-tests-with-summary.sh env TF_ACC=1 go test -ldflags "-X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn" ./internal/provider/... -v -run "$DASHBOARD_ACC_PATTERN" -skip "$skip_pattern" -timeout 120m -parallel=4
      # Uploads on pass too (an empty file) and overwrites the earlier attempt,
      # so after any re-run each shard has one file for its latest result.
      - name: Upload failed test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-dashboard-unsharded
          path: ${{ env.FAILED_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      # No attempt number in the name: a re-run replaces the file of its own job
      # and keeps the files of jobs that did not re-run, so the check sees every job.
      - name: Upload ran test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ran-tests-dashboard-unsharded
          path: ${{ env.RAN_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  provider-migration:
    name: Provider migration (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    env:
      GO111MODULE: on
      FAILED_TESTS_FILE: failed-tests/provider-migration-${{ matrix.shard }}.txt
      RAN_TESTS_FILE: ran-tests/provider-migration-${{ matrix.shard }}.txt
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: dashboard-grpc-v3.6.0
            pattern: *dashboard_migration_v360_pattern
          - shard: dashboard-schema-v3
            pattern: *dashboard_migration_schema_v3_pattern
          - shard: dashboard-same-schema-version
            pattern: *dashboard_migration_same_schema_version_pattern
          - shard: events2metric-v3.8.0-and-v3.21.0
            pattern: *events2metric_migration_acc_pattern
          - shard: user-scim-v3.14.0
            pattern: *user_migration_acc_pattern
          - shard: global-router-v3.19.0
            pattern: *global_router_migration_acc_pattern
          - shard: generated-upgrade
            pattern: *generated_upgrade_acc_pattern
            skip: *generated_upgrade_skip_pattern
          - shard: quota-allocation-rule-set
            pattern: *quota_acc_pattern
            procs: 1
          - shard: archive-logs
            pattern: *archive_logs_acc_pattern
            procs: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Test pinned gRPC to current REST provider migration
        env:
          CORALOGIX_ENV: ${{ secrets.CORALOGIX_ENV }}
          CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
          # The coralogix_slo_v2 upgrade test creates APM SLOs, which need a catalog service.
          CORALOGIX_SLO_V2_APM_SERVICE: ${{ secrets.CORALOGIX_SLO_V2_APM_SERVICE }}
          # The coralogix_integration upgrade test needs a role that the tenant can assume.
          AWS_TEST_ROLE: ${{ secrets.AWS_TEST_ROLE }}
          ARCHIVE_LOGS_BUCKET: ${{ secrets.ARCHIVE_LOGS_BUCKET }}
        run: |
          bash .github/scripts/run-tests-with-summary.sh env CORALOGIX_DASHBOARD_MIGRATION_ACC=1 CORALOGIX_EVENTS2METRIC_MIGRATION_ACC=1 CORALOGIX_USER_MIGRATION_ACC=1 CORALOGIX_GLOBAL_ROUTER_MIGRATION_ACC=1 CORALOGIX_GENERATED_UPGRADE_ACC=1 TF_ACC=1 TF_ACC_PROVIDER_NAMESPACE=coralogix go test -p ${{ matrix.procs || 4 }} -ldflags "-X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn" ./internal/provider/... -run '${{ matrix.pattern }}' -skip '${{ matrix.skip }}' -v -count=1 -timeout 120m -parallel=3
      # Uploads on pass too (an empty file) and overwrites the earlier attempt,
      # so after any re-run each shard has one file for its latest result.
      - name: Upload failed test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-provider-migration-${{ matrix.shard }}
          path: ${{ env.FAILED_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      # No attempt number in the name: a re-run replaces the file of its own job
      # and keeps the files of jobs that did not re-run, so the check sees every job.
      - name: Upload ran test names
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ran-tests-provider-migration-${{ matrix.shard }}
          path: ${{ env.RAN_TESTS_FILE }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  list-tests:
    name: List all tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: List every test in every package
        run: |
          set -euo pipefail
          mkdir -p listed-tests
          go test -ldflags "-X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn" -list '.*' ./... \
            | bash .github/scripts/go-test-names.sh --list > listed-tests/listed-tests.txt
      - name: Upload listed test names
        uses: actions/upload-artifact@v7
        with:
          name: listed-tests
          path: listed-tests/listed-tests.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test-coverage:
    name: Acceptance test coverage
    # Fails when a test ran in no job, or passed or failed in two jobs.
    # Runs when every test job ran. A failed job still counts: its file lists
    # the tests it ran before it failed.
    needs:
      - changes
      - test
      - test-unsharded
      - dashboard
      - dashboard-unsharded
      - provider-migration
      - list-tests
    if: ${{ always() && needs.changes.outputs.code == 'true' && needs.list-tests.result == 'success' && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download listed test names
        uses: actions/download-artifact@v8
        with:
          name: listed-tests
          path: listed-tests
      - name: Download ran test names
        uses: actions/download-artifact@v8
        with:
          pattern: ran-tests-*
          path: ran-tests
          merge-multiple: true
      - name: Check that every test ran in exactly one job
        run: bash .github/scripts/check-test-coverage.sh listed-tests/listed-tests.txt ran-tests/*.txt

  acceptance-result:
    # Branch protection requires this check name. Keep it stable.
    name: Acceptance tests result
    # always() keeps this job from being skipped. GitHub counts a skipped
    # required check as passed. While the run waits in the concurrency queue,
    # the check is missing, so the pull request cannot merge.
    if: ${{ always() }}
    needs:
      - changes
      - test
      - test-unsharded
      - dashboard
      - dashboard-unsharded
      - provider-migration
      - list-tests
      - test-coverage
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      # Each test job uploads one file, named after its shard. The file is empty
      # when the job passed. merge-multiple puts all files in one folder: GitHub
      # skips the per-artifact folder when only one artifact matches.
      - name: Download failed test names
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: actions/download-artifact@v8
        with:
          pattern: failed-tests-*
          path: failed-tests
          merge-multiple: true
      - name: Write failed tests summary
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          shopt -s nullglob
          files=()
          for file in failed-tests/*.txt; do
            if [ -s "$file" ]; then
              files+=("$file")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          {
            echo '## Failed acceptance tests'
            for file in "${files[@]}"; do
              printf '\n### %s\n\n```text\n' "$(basename "$file" .txt)"
              cat "$file"
              printf '```\n'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any acceptance job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  notify-failure:
    name: Notify Slack on failure
    # Scheduled (nightly) and master push runs alert. Pull request runs stay quiet.
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'push') }}
    needs:
      - changes
      - test
      - test-unsharded
      - dashboard
      - dashboard-unsharded
      - provider-migration
      - list-tests
      - test-coverage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          # Slack incoming webhook URL, from the SLACK_CI_WEBHOOK_URL repository secret.
          # This is a public repo with public Actions logs. Keep the URL out of both the
          # logs and the process list: it goes into a 0600 curl config file, never into
          # argv, echo, jq, or `set -x`.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_CI_WEBHOOK_URL is not set; skipping the Slack notification."
            exit 0
          fi
          # curl reads the URL from this file, so it never appears in the process list.
          umask 077
          curl_config="$(mktemp)"
          trap 'rm -f "$curl_config"' EXIT
          printf 'url = "%s"\n' "$SLACK_WEBHOOK_URL" > "$curl_config"
          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | map("• \(.key): \(.value.result)")
            | join("\n")
          ')
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg ref "$REF_NAME" \
            --arg event "$EVENT_NAME" \
            --arg url "$RUN_URL" \
            --arg jobs "$failed_jobs" \
            '{
              text: ":rotating_light: Acceptance tests failed",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ":rotating_light: *Acceptance tests failed*\n*Repository:* \($repo)\n*Ref:* \($ref)\n*Trigger:* \($event)\n*Failed jobs:*\n\($jobs)\n<\($url)|View the workflow run>"
                  }
                }
              ]
            }' \
            | curl --config "$curl_config" \
                --fail --silent --show-error \
                --max-time 30 --retry 3 --retry-connrefused \
                --header 'Content-Type: application/json' \
                --data @- \
                --output /dev/null \
                --write-out 'Slack responded with HTTP %{http_code}\n'
