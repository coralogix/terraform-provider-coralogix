# The behavior-overrides file of the synthetic resource whose API holds values in wrapper objects.
resource: WrapThing
mode: existing

validators:
  inferred: false

unwrap: [Tags, LuceneQuery, PriorityValue, Threshold, UUID, FilterHolder, Selection, ListSelection]

types:
  WrapThing:
    fields:
      rawQuery:
        unwrap: false
      mainLabel:
        unwrap: true
      offset:
        terraformType: Int64
      window:
        asString: true
        validators:
          - regexMatches: {pattern: '^[0-9]+(s|m|h)$', message: Use a duration such as 90m}
  SimpleFilter:
    fields:
      span:
        terraformType: Int64
  Tags:
    fields:
      values:
        collection: set
  # The client makes the id of a panel when the configuration leaves it out.
  WrapPanel:
    fields:
      id: {clientID: uuid}
enums:
  WindowValue:
    zero: 1_MINUTE
    values: [WINDOW_VALUE_MINUTES_5, WINDOW_VALUE_HOURS_2]
    names: {WINDOW_VALUE_MINUTES_5: 5_MINUTES, WINDOW_VALUE_HOURS_2: 2_HOURS}
