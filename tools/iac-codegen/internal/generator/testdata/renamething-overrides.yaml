# A released resource whose requests have a shape of their own: the wrapper holds RenameSpec, three
# fields have other names there (the list one object deeper), and Update sends the id beside the wrapper.
resource: RenameThing
mode: existing
typeName: rename_thing

validators:
  inferred: false

api:
  requestWrapper: spec
  updateIDInBody: true
  updateIDOutsideWrapper: true
  idProperty: id
  serverSetID: true
  customMethods: true
  createResponseOnlyIDProperty: thingId
  requestNames:
    kind: specKind
    version: specVersion
    parameters: holder.items
  operations:
    create: RenameThingsService_SaveRenameThing
    get: RenameThingsService_GetRenameThing
    update: RenameThingsService_UpdateRenameThing
    delete: RenameThingsService_DeleteRenameThing
