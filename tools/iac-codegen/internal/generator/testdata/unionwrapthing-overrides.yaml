# The behavior-overrides file of the synthetic resource whose fields are in one object of the API,
# with the arms of a oneOf. The object is inlined, so its fields and its arms are top-level
# attributes. The contract does not require the object, so the line says that the API always has it.
resource: UnionWrapThing
mode: existing

validators:
  inferred: false

api:
  updateIDInBody: true
  serverSetID: true
  customMethods: true
  operations:
    create: UnionWrapThingsService_CreateUnionWrapThing
    get: UnionWrapThingsService_GetUnionWrapThing
    update: UnionWrapThingsService_ReplaceUnionWrapThing
    delete: UnionWrapThingsService_DeleteUnionWrapThing

groups:
  kind:
    fields: [armA, armB, armC]
    requireOne: true

types:
  UnionWrapThing:
    fields:
      thing: {inline: true, required: true}
      # The reminders are one list of the thing in the API. Terraform shows each reminder in the item
      # that it names. Only a reminder whose definition has a link is shown: the path goes through the
      # definition, which the line of the reminder inlines, and the link, which the line of the definition inlines.
      reminders:
        distributeTo:
          item: UnionItem
          as: reminders
          by: {listField: itemName, itemField: name}
          keep: definition.link
      # The API variant follows the arm that is set. The arms are in the group kind.
      variant: {requestValueBy: {armA: THING_VARIANT_A_OR_UNSPECIFIED, armB: THING_VARIANT_B, armC: THING_VARIANT_C}}
      id: {readOnly: true}

  # The items hold three objects that their lines inline: an optional one, one with a field of the
  # name of its own field, and an arm of a oneOf that stays beside the other arm.
  UnionItem:
    fields:
      extra: {inline: true}
      # The object has a field named value too: the extra keys of this line are the keys of that field.
      value: {inline: true, markdownDescription: The value of the item.}
  ItemOptions:
    fields:
      custom: {inline: true}
  # A definition is a oneOf of a link and a target. The target is skipped, and the line of the link
  # says that the API always has it, so a request always sends the link. An action holds its
  # definition in an object that it inlines too, so the url is a flat attribute of the action. The
  # skip line of the target is carried to the action.
  # The url of the link is promoted twice: the action inlines its definition, and the definition inlines
  # its link. The line of the url is a line of the action.
  ItemAction:
    fields:
      definition: {inline: true}
      url: {markdownDescription: The url of the action.}
  ActionDefinition:
    fields:
      link: {inline: true, required: true}
      target: {skip: true}
  # A reminder inlines its definition, like an action.
  UnionReminder:
    fields:
      definition: {inline: true}
  # The same component has another name for its label in the first place than in the second.
  Tag:
    at:
      UnionItem.first:
        fields: {label: {name: title}}
      # Any key of a field line is a place line. The second place requires the label, and the first does not.
      UnionItem.second:
        fields: {label: {required: true, markdownDescription: The label of the second tag.}}

  # The same component holds its value in an object in two places. The first place inlines the
  # value, and names the note remark. The items of the list keep the object and the note.
  Pick:
    at:
      UnionItem.choice:
        fields:
          value: {inline: true}
          note: {name: remark}

enums:
  ThingVariant:
    zero: a
    values: [THING_VARIANT_B, THING_VARIANT_C]
