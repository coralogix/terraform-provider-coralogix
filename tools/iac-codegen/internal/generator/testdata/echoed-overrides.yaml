# The behavior-overrides file of the synthetic resource whose Replace echoes server values.
resource: EchoThing
mode: existing

validators:
  inferred: false

api:
  updateIDInBody: true

types:
  EchoThing:
    fields:
      id: {readOnly: true}
      name:
        validators:
          - lengthAtLeast: 1
          - regexMatches: {pattern: '^[A-Za-z\d_:-]*$', message: 'Invalid name, use ASCII letters, digits, underscores, and colons.'}
      createTime: {skip: true}
      isInternal: {skip: true}
      quota: {createAs: {limit: limitValue}, computed: true}
      # The API returns [] for no items or labels; the released resource reads null.
      items: {name: entries, keyedBy: {key: key}, readEmptyAs: "null"}
      labels: {keyedBy: {key: name, value: value}, readEmptyAs: "null"}
      measures:
        computed: true
        useNonNullStateForUnknown: true
        keyedBy: {key: kind, object: true, arms: {MEASURE_KIND_SAMPLES: samples}, keyAs: name}
      kind: {requestValueBy: {quota: KIND_LIMITED}}
  Quota:
    fields:
      exceeded: {readOnly: true, name: has_exceeded}
      limit: {computed: true, useStateForUnknown: true, validators: [{atLeast: 0}]}
  EchoItem:
    fields:
      values: {optional: true, collection: set, name: tags}
      enabled: {computed: true, name: enable}
      none: {skip: true}
      attrs: {optional: true}
      # The API returns [] for no levels; the released resource reads null.
      levels: {collection: set, readEmptyAs: "null", validators: [{enum: true}]}
  Measure:
    fields:
      name: {readOnly: true}
      enabled: {computed: true, name: enable}
      samples: {unwrap: true, name: count}
enums:
  MeasureKind:
    zero: unspecified
    values: [MEASURE_KIND_MIN, MEASURE_KIND_SAMPLES]
    names: {MEASURE_KIND_MIN: min, MEASURE_KIND_SAMPLES: samples}
  Level:
    zero: Unspecified
    values: [LEVEL_LOW, LEVEL_HIGH]
    names: {LEVEL_LOW: Low, LEVEL_HIGH: High}
