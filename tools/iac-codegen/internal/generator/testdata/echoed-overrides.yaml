# The behavior-overrides file of the synthetic resource whose Replace echoes server values.
resource: EchoThing
mode: existing

validators:
  inferred: false

api:
  updateIDInBody: true

types:
  EchoThing:
    fields:
      id: {readOnly: true}
      createTime: {skip: true}
      isInternal: {skip: true}
      quota: {createAs: {limit: limitValue}}
  Quota:
    fields:
      exceeded: {readOnly: true}
      limit: {computed: true}
  EchoItem:
    fields:
      values: {optional: true}
      enabled: {computed: true}
      none: {skip: true}
