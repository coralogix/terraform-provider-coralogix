# A resource that users already have, as an API of its age has it: Create, Get, and Replace
# answer {"thing": {"allOf": [$ref]}}, Replace takes the whole resource with its required
# server-set id in the body and on the Create path, and Replace echoes a server time and an
# internal flag that the resource does not manage. Create takes the quota limit flat
# (limitValue), while Replace and Get hold it in quota; the server sets quota.exceeded. Each item
# requires values, which may be empty, has an enabled flag with no presence, and a oneOf with an
# empty "none" marker. The detail of an item holds float32 numbers. The levels
# of an item are a set of an enum whose released spelling is Low and High, and which accepts the
# zero value. The kind is required, and the resource derives it from quota.
# The released resource shows the items as a map keyed by their key, and the labels as a map
# from name to value. The measures are a list of items keyed by an enum kind; the released
# resource shows them as an object with an attribute per kind, which holds only the oneOf arm of
# its kind, and names each item after its attribute.
openapi: 3.1.0
info: {title: echoed, version: 1.0.0}
paths:
  /echo/v1/things:
    post:
      tags: [Echo Things Service]
      operationId: EchoThingsService_CreateEchoThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Create Echo Thing Request
              type: object
              required: [name, kind]
              properties:
                name: {type: string, minLength: 1}
                kind: {$ref: '#/components/schemas/Kind'}
                limitValue: {type: integer, format: int32, x-coralogix-presence: true}
                items:
                  type: array
                  items: {$ref: '#/components/schemas/EchoItem'}
                labels:
                  type: array
                  items: {$ref: '#/components/schemas/Label'}
                measures:
                  type: array
                  items: {$ref: '#/components/schemas/Measure'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateEchoThingResponse'}
    put:
      tags: [Echo Things Service]
      operationId: EchoThingsService_ReplaceEchoThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Replace Echo Thing Request
              type: object
              required: [id, name, kind]
              properties:
                id: {type: string}
                name: {type: string, minLength: 1}
                kind: {$ref: '#/components/schemas/Kind'}
                createTime: {type: string}
                isInternal: {type: boolean}
                quota: {$ref: '#/components/schemas/Quota'}
                items:
                  type: array
                  items: {$ref: '#/components/schemas/EchoItem'}
                labels:
                  type: array
                  items: {$ref: '#/components/schemas/Label'}
                measures:
                  type: array
                  items: {$ref: '#/components/schemas/Measure'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplaceEchoThingResponse'}
  /echo/v1/things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Echo Things Service]
      operationId: EchoThingsService_GetEchoThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetEchoThingResponse'}
    delete:
      tags: [Echo Things Service]
      operationId: EchoThingsService_DeleteEchoThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteEchoThingResponse'}
components:
  schemas:
    CreateEchoThingResponse:
      type: object
      properties:
        thing:
          allOf: [{$ref: '#/components/schemas/EchoThing'}]
    GetEchoThingResponse:
      type: object
      required: [thing]
      properties:
        thing:
          allOf: [{$ref: '#/components/schemas/EchoThing'}]
    ReplaceEchoThingResponse:
      type: object
      required: [thing]
      properties:
        thing:
          allOf: [{$ref: '#/components/schemas/EchoThing'}]
    DeleteEchoThingResponse:
      type: object
      required: []
    EchoThing:
      type: object
      required: [id, name, kind]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1}
        kind: {$ref: '#/components/schemas/Kind'}
        createTime: {type: string}
        isInternal: {type: boolean}
        quota: {$ref: '#/components/schemas/Quota'}
        items:
          type: array
          items: {$ref: '#/components/schemas/EchoItem'}
        labels:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        measures:
          type: array
          items: {$ref: '#/components/schemas/Measure'}
    Measure:
      type: object
      required: [kind, name]
      oneOf:
        - {required: [samples], type: object}
        - {type: object, not: {anyOf: [{required: [samples], type: object}]}}
      properties:
        kind: {$ref: '#/components/schemas/MeasureKind'}
        name: {type: string, minLength: 1}
        enabled: {type: boolean}
        samples: {$ref: '#/components/schemas/Samples'}
    Samples:
      type: object
      required: [count]
      properties:
        count: {type: integer, format: int32, minimum: 1}
    MeasureKind:
      type: string
      enum: [MEASURE_KIND_UNSPECIFIED, MEASURE_KIND_MIN, MEASURE_KIND_SAMPLES]
    Label:
      type: object
      required: [name, value]
      properties:
        name: {type: string, minLength: 1}
        value: {type: string, minLength: 1}
    Quota:
      type: object
      required: [limit, exceeded]
      properties:
        limit: {type: integer, format: int32}
        exceeded: {type: boolean}
    EchoItem:
      type: object
      required: [key, values]
      oneOf:
        - {required: [none], type: object}
        - {required: [detail], type: object}
        - {type: object, not: {anyOf: [{required: [none], type: object}, {required: [detail], type: object}]}}
      properties:
        key: {type: string, minLength: 1}
        values:
          type: array
          minItems: 0
          items: {type: string}
        enabled: {type: boolean}
        levels:
          type: array
          items: {$ref: '#/components/schemas/Level'}
        none: {type: object, description: No detail.}
        detail: {$ref: '#/components/schemas/Detail'}
    Kind:
      type: string
      enum: [KIND_UNSPECIFIED, KIND_LIMITED, KIND_PLAIN]
    Level:
      type: string
      enum: [LEVEL_UNSPECIFIED, LEVEL_LOW, LEVEL_HIGH]
    Detail:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1}
        ratio: {type: number, format: float, x-coralogix-presence: true}
        buckets:
          type: array
          items: {type: number, format: float}
