# The behavior-overrides file of the synthetic resource whose string fields hold documents.
resource: ConfigThing
mode: existing
# A hook that runs after the equality steps of the plan.
modifyPlan: true

validators:
  inferred: false

types:
  ConfigThing:
    fields:
      settings:
        equality: json
      template:
        equality: json
      remotes:
        keepPriorOrder: true
      # A released map validator: each key of the map matches the pattern.
      metadata:
        validators:
          - keysAre: {pattern: "^[a-z.]+$", message: "keys must be lower case"}
    extraAttributes:
      # An Optional and Computed document that a hook fills in. The plan keeps the state value when
      # the configured JSON is the same document.
      policy:
        type: string
        optional: true
        computed: true
        useStateForUnknown: true
        equality: json
        markdownDescription: A JSON policy that a hook sends and reads back.
      # An Optional and Computed object: its model field is types.Object, which can be unknown.
      limits:
        type: object
        optional: true
        computed: true
        useStateForUnknown: true
        markdownDescription: Limits that a hook fills in.
        attributes:
          max:
            type: int64
            markdownDescription: The most that the thing can do.
      # A Terraform-only object that a hook turns into the request.
      schedule:
        type: object
        inUpdate: true
        markdownDescription: When the thing is active.
        attributes:
          active_on:
            type: object
            required: true
            markdownDescription: The active window.
            attributes:
              days_of_week:
                type: set
                elementType: string
                required: true
                elementValues: [Monday, Tuesday]
                markdownDescription: Days of the week.
              start_time:
                type: string
                required: true
                validators:
                  - regexMatches: {pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$", message: "use 24h time like 15:04"}
                markdownDescription: Start of the window.
              utc_offset:
                type: string
                optional: true
                computed: true
                default: "+0000"
                validators:
                  - regexMatches: {pattern: "^[+-]([01][0-9]|2[0-3])[0-5][0-9]$", message: "use an offset like -0700"}
                markdownDescription: Time zone of the window.
              enabled:
                type: bool
                optional: true
                computed: true
                default: true
                markdownDescription: Whether the window applies.
              tags:
                type: list
                elementType: string
                markdownDescription: Labels of the window.
              limit:
                type: int64
                optional: true
                computed: true
                default: 3
                markdownDescription: How many times the window applies.
  ConfigRemote:
    fields:
      rawConfiguration:
        equality: yaml
