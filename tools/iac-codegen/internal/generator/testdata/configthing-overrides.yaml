# The behavior-overrides file of the synthetic resource whose string fields hold documents.
resource: ConfigThing
mode: existing

validators:
  inferred: false

types:
  ConfigThing:
    fields:
      settings:
        equality: json
      template:
        equality: json
      remotes:
        keepPriorOrder: true
      # A released map validator: each key of the map matches the pattern.
      metadata:
        validators:
          - keysAre: {pattern: "^[a-z.]+$", message: "keys must be lower case"}
  ConfigRemote:
    fields:
      rawConfiguration:
        equality: yaml
