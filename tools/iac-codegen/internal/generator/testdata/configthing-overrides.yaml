# The behavior-overrides file of the synthetic resource whose string fields hold documents.
resource: ConfigThing
mode: existing

validators:
  inferred: false

types:
  ConfigThing:
    fields:
      settings:
        equality: json
      template:
        equality: json
      remotes:
        keepPriorOrder: true
  ConfigRemote:
    fields:
      rawConfiguration:
        equality: yaml
