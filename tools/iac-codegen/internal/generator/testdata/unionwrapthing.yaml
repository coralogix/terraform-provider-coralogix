# A released resource whose API wraps all of its fields in one object, thing, that holds the arms of
# a oneOf next to common fields. The requests and the response do not require the object, although
# the API always has it. The Replace request sends the id next to it.
openapi: 3.1.0
info: {title: unionwrap, version: 1.0.0}
paths:
  /unionwrap/v1/things:
    post:
      tags: [Union Wrap Things Service]
      operationId: UnionWrapThingsService_CreateUnionWrapThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Create Union Wrap Thing Request
              type: object
              properties:
                thing:
                  allOf: [{$ref: '#/components/schemas/Thing'}]
                  description: The properties of the thing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateUnionWrapThingResponse'}
    put:
      tags: [Union Wrap Things Service]
      operationId: UnionWrapThingsService_ReplaceUnionWrapThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Replace Union Wrap Thing Request
              type: object
              properties:
                thing:
                  allOf: [{$ref: '#/components/schemas/Thing'}]
                  description: The properties of the thing
                id: {type: string, x-coralogix-presence: true}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplaceUnionWrapThingResponse'}
  /unionwrap/v1/things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Union Wrap Things Service]
      operationId: UnionWrapThingsService_GetUnionWrapThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetUnionWrapThingResponse'}
    delete:
      tags: [Union Wrap Things Service]
      operationId: UnionWrapThingsService_DeleteUnionWrapThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteUnionWrapThingResponse'}
components:
  schemas:
    DeleteUnionWrapThingResponse:
      type: object
      required: []
    CreateUnionWrapThingResponse:
      type: object
      properties:
        unionWrapThing: {$ref: '#/components/schemas/UnionWrapThing'}
    GetUnionWrapThingResponse:
      type: object
      properties:
        unionWrapThing: {$ref: '#/components/schemas/UnionWrapThing'}
    ReplaceUnionWrapThingResponse:
      type: object
      properties:
        unionWrapThing: {$ref: '#/components/schemas/UnionWrapThing'}
    UnionWrapThing:
      type: object
      properties:
        id: {type: string, x-coralogix-presence: true}
        thing:
          allOf: [{$ref: '#/components/schemas/Thing'}]
          description: The properties of the thing
    Thing:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string, x-coralogix-presence: true}
        variant:
          allOf: [{$ref: '#/components/schemas/ThingVariant'}]
          description: The variant, which follows the arm that is set
        armA: {$ref: '#/components/schemas/ArmA'}
        armB: {$ref: '#/components/schemas/ArmB'}
        armC: {$ref: '#/components/schemas/ArmC'}
        items:
          type: array
          items: {$ref: '#/components/schemas/UnionItem'}
      oneOf:
        - required: [armA]
        - required: [armB]
        - required: [armC]
        - not:
            anyOf:
              - required: [armA]
              - required: [armB]
              - required: [armC]
    ThingVariant:
      type: string
      enum: [THING_VARIANT_A_OR_UNSPECIFIED, THING_VARIANT_B, THING_VARIANT_C]
    ArmA:
      type: object
      required: [value]
      properties:
        value: {type: string, minLength: 1}
    ArmB:
      type: object
      required: []
      properties:
        count: {type: integer, format: int32, x-coralogix-presence: true}
    ArmC:
      type: object
      required: []
      properties:
        label: {type: string, x-coralogix-presence: true}
    # An item with three objects that its lines inline: an optional object (extra), an object that has
    # a field of the name of its own field (value.value), and an arm of a oneOf that stays beside
    # another arm (options.custom beside options.internal).
    UnionItem:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        extra: {$ref: '#/components/schemas/ItemExtra'}
        value:
          allOf: [{$ref: '#/components/schemas/Labelled'}]
          description: The value, held in an object with the same field.
        options: {$ref: '#/components/schemas/ItemOptions'}
        first: {$ref: '#/components/schemas/Tag'}
        second: {$ref: '#/components/schemas/Tag'}
        choice: {$ref: '#/components/schemas/Pick'}
        choices:
          type: array
          items: {$ref: '#/components/schemas/Pick'}
    # One component in two places. Terraform names its label title in the first place and label in the
    # second, as the released resource names a metric in two kinds of filter.
    Tag:
      type: object
      properties:
        label: {type: string, x-coralogix-presence: true}
    # One component in two places that hold its value in different shapes. The single place (choice)
    # inlines the value: choice = {value, label, remark}. The list (choices) keeps the object:
    # choices = [{value = {value, label}, note}].
    Pick:
      type: object
      properties:
        value:
          allOf: [{$ref: '#/components/schemas/Labelled'}]
          description: The value, held in an object.
        note: {type: string, x-coralogix-presence: true}
    ItemExtra:
      type: object
      properties:
        note: {type: string, x-coralogix-presence: true}
    Labelled:
      type: object
      properties:
        value: {type: string, x-coralogix-presence: true}
        label: {type: string, x-coralogix-presence: true}
    ItemOptions:
      type: object
      oneOf:
        - required: [custom]
        - required: [internal]
        - not:
            anyOf:
              - required: [custom]
              - required: [internal]
      properties:
        custom: {allOf: [{$ref: '#/components/schemas/CustomOptions'}]}
        internal: {$ref: '#/components/schemas/InternalOptions'}
    CustomOptions:
      type: object
      properties:
        title: {type: string, x-coralogix-presence: true}
        collapsed: {type: boolean, x-coralogix-presence: true}
    InternalOptions:
      type: object
      additionalProperties: false
