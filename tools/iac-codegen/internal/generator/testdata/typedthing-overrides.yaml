# A released resource that shows oneOf fields as a type attribute plus the merged fields of the
# arms, as the aggregations and span fields of a dashboard widget are.
resource: TypedThing
mode: existing
typeName: typed_thing

validators:
  inferred: false

api:
  operations:
    create: TypedThingsService_CreateTypedThing
    get: TypedThingsService_GetTypedThing
    update: TypedThingsService_ReplaceTypedThing
    delete: TypedThingsService_DeleteTypedThing
  idProperty: id
  serverSetID: true

types:
  TypedThing:
    fields:
      id: {readOnly: true}
      # The legacy selection is the list of values: [] selects all.
      pick: {name: picked_values, computed: true, default: []}
  # The value of the span value is a span field, which has a typedArms line (below). The inline line
  # moves its arms into the span value, which shows them as the span field does: span_value =
  # {type, value}, with no value object between.
  # A field beside the object that the line skips is no arm: the contract has note, Terraform does not.
  TypedSpanValue:
    fields:
      value: {inline: true}
      note: {skip: true}
  TypedAggregation:
    typedArms:
      # The released spelling of an arm that is not its name: average is avg.
      names: {average: avg}
  # The released resource lets the user leave out selection_type: no values select all.
  TypedSelection:
    typedArms: {field: selection_type, infer: true}
  # An operator is one object: equals and not_equals, each with a selection of its own. The selection
  # of an arm is shown as the attributes of the operator.
  TypedOperator:
    typedArms: {names: {notEquals: not_equals}}
  TypedNotSelection:
    typedArms: {field: selection_type, infer: true}
  TypedNotList:
    fields:
      values: {name: selected_values, computed: true, default: []}
  # An empty text that the user set stays "" instead of reading as null: flatten needs the prior
  # value, also when the field is in an arm of a typedArms object.
  TypedList:
    fields:
      values: {name: selected_values, computed: true, default: []}
      note: {readEmptyAs: "null"}
  # Only the second arm needs the prior value, for a field that both arms share. The merged field
  # is a copy of the first arm's, so it has no trace of that need.
  TypedPercentile:
    fields:
      # Per-arm rule: exactly one of field and unit is set when the type is percentile. The rule
      # does not apply to the average, which shares the field attribute.
      field: {readEmptyAs: "null", validators: [{exactlyOneOf: [unit]}]}
      percentileUnit: {name: unit}
  # Two arms call their field by different API names, and the released resource shows both as
  # unit: one attribute.
  TypedAverage:
    fields:
      averageUnit: {name: unit}
  # The last scalar arm needs the prior value for the value that all scalar arms share.
  TypedSpanField:
    fields:
      processTagField: {readEmptyAs: "null"}
    typedArms:
      names: {metadataField: metadata, tagField: tag, processTagField: process_tag}

  # A oneOf of all and a list is shown as that list, with no type attribute: [] is all, and values
  # are the list. The labels of the list arm are not shown.
  TypedPick:
    typedArms: {asList: true}
  TypedPickList:
    fields:
      labels: {skip: true}

enums:
  # The enum of the first arm and the free text of the second arm share one attribute, mode. The
  # enum is checked only when the type names the arm that has it.
  TypedMode:
    zero: unspecified
    trimPrefix: MODE_
  TypedRounding:
    zero: unspecified
    trimPrefix: ROUNDING_
  TypedMetadataField:
    zero: unspecified
    trimPrefix: METADATA_FIELD_
