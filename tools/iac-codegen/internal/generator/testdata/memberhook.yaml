openapi: 3.1.0
info:
  title: member
  version: 1.0.0
paths:
  /memberhooks/v1:
    get:
      tags:
      - Member Hook Service
      operationId: MemberHookService_SearchMembers
      parameters:
      - name: status
        in: query
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/MemberStatus'
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: page_token
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberHookSearchResponse'
    post:
      tags:
      - Member Hook Service
      operationId: MemberHookService_CreateMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMembersResponse'
    put:
      tags:
      - Member Hook Service
      operationId: MemberHookService_UpdateMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMembersResponse'
  /memberhooks/v1:updateStatuses:
    patch:
      tags:
      - Member Hook Service
      operationId: MemberHookService_UpdateMembersStatuses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: UpdateMemberStatusRequest
              type: object
              properties:
                status:
                  allOf:
                  - $ref: '#/components/schemas/MemberStatus'
                memberIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMembersStatusesResponse'
components:
  schemas:
    MemberHookSearchResponse:
      type: object
      required:
      - members
      - nextPageToken
      properties:
        nextPageToken:
          type: integer
          format: int64
          minimum: 0
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    CreateMembersResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CreateMemberResult'
    CreateMemberRequest:
      type: object
      required:
      - template
      properties:
        onboardingMode:
          $ref: '#/components/schemas/OnboardingMode'
        template:
          $ref: '#/components/schemas/MemberTemplate'
    UpdateMemberRequest:
      type: object
      required:
      - memberId
      properties:
        memberId:
          type: string
          minLength: 1
        template:
          $ref: '#/components/schemas/MemberTemplate'
    UpdateMembersResponse:
      type: object
      required: []
    UpdateMembersStatusesResponse:
      type: object
      required: []
    UpdateMemberStatusRequest:
      title: UpdateMemberStatusRequest
      type: object
      required:
      - memberIds
      - status
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/MemberStatus'
        memberIds:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 255
    MemberStatus:
      type: string
      enum:
      - MEMBER_STATUS_UNSPECIFIED
      - MEMBER_STATUS_ACTIVE
      - MEMBER_STATUS_INACTIVE
    OnboardingMode:
      type: string
      enum:
      - ONBOARDING_MODE_UNSPECIFIED
      - ONBOARDING_MODE_INVITE_LINK
      - ONBOARDING_MODE_NO_INVITE
    Member:
      title: Member
      type: object
      required:
      - memberId
      - login
      properties:
        memberId:
          type: string
          minLength: 1
        login:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 0
        groupIds:
          type: array
          minItems: 0
          items:
            type: integer
            format: int64
            minimum: 0
        status:
          allOf:
          - $ref: '#/components/schemas/MemberStatus'
        loginModes:
          type: array
          minItems: 0
          maxItems: 2
          items:
            $ref: '#/components/schemas/LoginMode'
    MemberTemplate:
      title: MemberTemplate
      type: object
      required:
      - login
      properties:
        login:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 0
        status:
          allOf:
          - $ref: '#/components/schemas/MemberStatus'
        loginModes:
          type: array
          minItems: 0
          maxItems: 2
          items:
            $ref: '#/components/schemas/LoginMode'
    CreateMemberResult:
      type: object
      required:
      - username
      properties:
        message:
          type: string
          minLength: 1
          x-coralogix-presence: true
        status:
          $ref: '#/components/schemas/CreateMemberStatus'
        member:
          $ref: '#/components/schemas/Member'
        username:
          type: string
          minLength: 1
    CreateMemberStatus:
      type: string
      enum:
      - CREATE_MEMBER_STATUS_UNSPECIFIED
      - CREATE_MEMBER_STATUS_CREATED
      - CREATE_MEMBER_STATUS_INVITED
      - CREATE_MEMBER_STATUS_FAILED
    LoginMode:
      type: string
      enum:
      - LOGIN_MODE_UNSPECIFIED
      - LOGIN_MODE_SSO
      - LOGIN_MODE_LOCAL
