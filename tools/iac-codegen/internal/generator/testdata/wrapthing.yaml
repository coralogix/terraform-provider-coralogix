# A resource that users already have, whose API holds several values in wrapper objects: an
# object with one property, such as {"query": {"value": "error"}}. The released Terraform
# resource shows only the value. Most wrapper properties do not state presence: a wrapper that
# collapses states it. Label collapses in one place and stays an object in another, and
# LuceneQuery stays an object in rawQuery, so their properties state presence. The offset and the
# span of the filter are signed 64-bit numbers that the API sends as strings (^-?[0-9]+$); the
# released resource shows them as Int64. The tags are one list inside one wrapper, shown as a set. The window is a oneOf of an enum and a free
# duration, shown as one string. The notes are one list of the thing, and each note names its panel by id. The released resource
# showed them inside their panel.
openapi: 3.1.0
info: {title: wrap, version: 1.0.0}
paths:
  /wrap/v1/things:
    post:
      tags: [Wrap Things Service]
      operationId: WrapThingsService_CreateWrapThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Create Wrap Thing Request
              type: object
              required: [query]
              properties:
                name: {type: string, x-coralogix-presence: true}
                query: {$ref: '#/components/schemas/LuceneQuery'}
                rawQuery: {$ref: '#/components/schemas/LuceneQuery'}
                priority: {$ref: '#/components/schemas/PriorityValue'}
                threshold: {$ref: '#/components/schemas/Threshold'}
                widgetIds:
                  type: array
                  items: {$ref: '#/components/schemas/UUID'}
                filter: {$ref: '#/components/schemas/FilterHolder'}
                selection: {$ref: '#/components/schemas/Selection'}
                tags: {$ref: '#/components/schemas/Tags'}
                window: {$ref: '#/components/schemas/Window'}
                mainLabel: {$ref: '#/components/schemas/Label'}
                extraLabel: {$ref: '#/components/schemas/Label'}
                panels:
                  type: array
                  items: {$ref: '#/components/schemas/WrapPanel'}
                notes:
                  type: array
                  items: {$ref: '#/components/schemas/WrapNote'}
                folderPath: {$ref: '#/components/schemas/FolderPath'}
                homeId: {$ref: '#/components/schemas/UUID'}
                homePath: {$ref: '#/components/schemas/FolderPath'}
                offset: {type: string, pattern: "^-?[0-9]+$", minLength: 1, maxLength: 20, x-coralogix-presence: true}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WrapThing'}
  /wrap/v1/things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Wrap Things Service]
      operationId: WrapThingsService_GetWrapThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WrapThing'}
    put:
      tags: [Wrap Things Service]
      operationId: WrapThingsService_ReplaceWrapThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Replace Wrap Thing Request
              type: object
              required: [query]
              properties:
                name: {type: string, x-coralogix-presence: true}
                query: {$ref: '#/components/schemas/LuceneQuery'}
                rawQuery: {$ref: '#/components/schemas/LuceneQuery'}
                priority: {$ref: '#/components/schemas/PriorityValue'}
                threshold: {$ref: '#/components/schemas/Threshold'}
                widgetIds:
                  type: array
                  items: {$ref: '#/components/schemas/UUID'}
                filter: {$ref: '#/components/schemas/FilterHolder'}
                selection: {$ref: '#/components/schemas/Selection'}
                tags: {$ref: '#/components/schemas/Tags'}
                window: {$ref: '#/components/schemas/Window'}
                mainLabel: {$ref: '#/components/schemas/Label'}
                extraLabel: {$ref: '#/components/schemas/Label'}
                panels:
                  type: array
                  items: {$ref: '#/components/schemas/WrapPanel'}
                notes:
                  type: array
                  items: {$ref: '#/components/schemas/WrapNote'}
                folderPath: {$ref: '#/components/schemas/FolderPath'}
                homeId: {$ref: '#/components/schemas/UUID'}
                homePath: {$ref: '#/components/schemas/FolderPath'}
                offset: {type: string, pattern: "^-?[0-9]+$", minLength: 1, maxLength: 20, x-coralogix-presence: true}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WrapThing'}
    delete:
      tags: [Wrap Things Service]
      operationId: WrapThingsService_DeleteWrapThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteWrapThingResponse'}
components:
  schemas:
    DeleteWrapThingResponse:
      type: object
      required: []
    WrapThing:
      type: object
      required: [id, query]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string, x-coralogix-presence: true}
        query:
          description: The query, held in a wrapper.
          allOf: [{$ref: '#/components/schemas/LuceneQuery'}]
        rawQuery:
          description: The query, kept as an object.
          allOf: [{$ref: '#/components/schemas/LuceneQuery'}]
        priority: {$ref: '#/components/schemas/PriorityValue'}
        threshold: {$ref: '#/components/schemas/Threshold'}
        widgetIds:
          description: The widgets, each held in a wrapper.
          type: array
          items: {$ref: '#/components/schemas/UUID'}
        filter: {$ref: '#/components/schemas/FilterHolder'}
        selection: {$ref: '#/components/schemas/Selection'}
        tags: {$ref: '#/components/schemas/Tags'}
        window: {$ref: '#/components/schemas/Window'}
        mainLabel: {$ref: '#/components/schemas/Label'}
        extraLabel: {$ref: '#/components/schemas/Label'}
        panels:
          type: array
          items: {$ref: '#/components/schemas/WrapPanel'}
        notes:
          type: array
          items: {$ref: '#/components/schemas/WrapNote'}
        folderPath: {$ref: '#/components/schemas/FolderPath'}
        homeId: {$ref: '#/components/schemas/UUID'}
        homePath: {$ref: '#/components/schemas/FolderPath'}
        offset: {type: string, pattern: "^-?[0-9]+$", minLength: 1, maxLength: 20, x-coralogix-presence: true}
    LuceneQuery:
      type: object
      required: []
      properties:
        value: {type: string, x-coralogix-presence: true}
    PriorityValue:
      type: object
      required: []
      properties:
        value: {$ref: '#/components/schemas/WrapPriority'}
    WrapPriority:
      type: string
      enum: [WRAP_PRIORITY_UNSPECIFIED, WRAP_PRIORITY_P1, WRAP_PRIORITY_P2]
    Threshold:
      type: object
      required: [value]
      properties:
        value: {type: number, format: double}
    UUID:
      type: object
      required: []
      properties:
        value: {type: string}
    FilterHolder:
      type: object
      required: []
      properties:
        filter: {$ref: '#/components/schemas/SimpleFilter'}
    SimpleFilter:
      type: object
      required: []
      properties:
        text: {type: string, x-coralogix-presence: true}
        limit: {type: integer, format: int32, x-coralogix-presence: true}
        span: {type: string, pattern: "^-?[0-9]+$", minLength: 1, maxLength: 20, x-coralogix-presence: true}
    Selection:
      type: object
      required: []
      properties:
        list: {$ref: '#/components/schemas/ListSelection'}
    ListSelection:
      type: object
      required: []
      properties:
        values:
          type: array
          items: {type: string}
    Window:
      type: object
      oneOf:
        - {required: [fixedValue], type: object}
        - {required: [customValue], type: object}
        - type: object
          not:
            anyOf:
              - {required: [fixedValue], type: object}
              - {required: [customValue], type: object}
      properties:
        fixedValue:
          description: The window as a value of the enum.
          allOf: [{$ref: '#/components/schemas/WindowValue'}]
        customValue: {type: string}
    WindowValue:
      type: string
      enum: [WINDOW_VALUE_MINUTES_1_OR_UNSPECIFIED, WINDOW_VALUE_MINUTES_5, WINDOW_VALUE_HOURS_2]
    Tags:
      type: object
      required: []
      properties:
        values:
          type: array
          items: {type: string}
    Label:
      type: object
      required: []
      properties:
        value: {type: string, x-coralogix-presence: true}
    # A panel has an id that the client makes: a UUID held in a wrapper, which the API requires.
    WrapPanel:
      type: object
      required: [id]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        title: {type: string, x-coralogix-presence: true}
    # A note names its panel by the id of the panel, a UUID in a wrapper. The notes are in the list of
    # the thing, not in the panel. The detail is set for a note of this kind, and a note without a url
    # is another kind of note, which the resource does not show.
    WrapNote:
      type: object
      required: [id, panelId]
      properties:
        id: {type: string}
        text: {type: string, x-coralogix-presence: true}
        panelId: {$ref: '#/components/schemas/UUID'}
        detail: {$ref: '#/components/schemas/NoteDetail'}
    NoteDetail:
      type: object
      required: []
      properties:
        url: {type: string, x-coralogix-presence: true}
    # A folder path: the segments, held in an object, which Terraform shows as one text "Team/Sub".
    FolderPath:
      type: object
      properties:
        segments:
          type: array
          items: {type: string}
