# The released group set thing: a set of groups whose interval has a validator next to its server
# default, a uint64 limit that the released attribute shows as Int64, a skipped server value that may
# not fit Int64, items that the released resource required, labels that the server fills in, and
# a document that a hook turns into the groups.
resource: GroupSetThing
mode: existing
typeName: group_set_thing
afterFlatten: true
# A plan hook, with no equality line in the resource: the generated ModifyPlan only calls it.
modifyPlan: true
schema:
  version: 1
  upgrade:
    0: {priorSchema: example.com/iac-test-sdk/groupsetprior.V0, strategy: refresh}
validators:
  inferred: false
api:
  operations:
    create: GroupSets_Create
    get: GroupSets_Fetch
    update: GroupSets_Update
    delete: GroupSets_Delete
  createResponseOnlyIDProperty: id
# The window is optional, as the released attribute is. It holds the absolute arm of a oneOf next
# to the group relative, which stands for the other arm, a plain duration: window = {absolute = {
# start, end}} or window = {relative = {duration}}.
groups:
  window:
    fields: [absoluteWindow]
    optional: true
    requireOne: true
    markdownDescription: The window of the set.
    groups:
      relative: {fields: [relativeWindow], optional: true}
  # The refresh holds the arms of a oneOf of objects without fields. It is one object with a type
  # that names the arm, and the type is off when the configuration leaves it out. The object is
  # Optional and Computed, so the API can choose the arm when the configuration sets none.
  refresh:
    fields: [off, fiveMinutes, oneHour]
    optional: true
    computed: true
    useStateForUnknown: true
    markdownDescription: How often the set refreshes.
    typedArms:
      default: off
      names: {oneHour: hourly}

types:
  GroupSetThing:
    fields:
      name: {computed: true, useStateForUnknown: true}
      groups: {computed: true, useStateForUnknown: true}
      absoluteWindow: {name: absolute}
      relativeWindow: {name: duration, required: true}
    extraAttributes:
      # An equality line of an extra attribute is a plan modifier only: the resource has a server
      # default, which the ModifyPlan of an equality line of a field does not allow.
      document:
        type: string
        equality: json
        markdownDescription: A document that a hook turns into the groups.
  OutGroupThing:
    # The period is an optional object that the server keeps: a group that leaves it out keeps what
    # the state has. The object of each item of the set has the modifier too, as the released schema has.
    useStateForUnknown: true
    groups:
      period:
        fields: [periodMinutes]
        optional: true
        computed: true
        useStateForUnknown: true
        markdownDescription: How often the group is retriggered.
    fields:
      periodMinutes: {required: true, markdownDescription: Minutes between retriggers.}
      lastSeenAt: {skip: true}
      interval:
        validators: [{atLeast: 60}]
        description: How often the group runs, in seconds.
      limit: {terraformType: Int64}
      items: {required: true}
  OutItemThing:
    fields:
      labels: {computed: true}
  # The relative arm, a plain duration, is an object of its own, as the released resource shows it:
  # relative = { duration = "15m" } beside absolute = { start, end }. The group stands for the arm.
  Schedule:
    groups:
      relative: {fields: [relativeWindow], optional: true}
    fields:
      absoluteWindow: {name: absolute}
      relativeWindow: {name: duration, required: true}
      # A oneOf of arms without fields is a string that names the arm: mode = "fast".
      mode: {asString: true}
  # The name of an arm is the string. A name line gives the released spelling.
  Mode:
    fields:
      balancedMode: {name: balanced}
