# A released resource whose Create and Update take the resource itself as the body, an inline
# copy with the title of the component, so the SDK names it SharedThing1. The responses hold the
# resource in a required field next to the ids of other objects that the call changed. The
# server sets the id, Get does not require it, and Update finds the resource by the id in the
# body. The released resource holds the oneOf arms and the frame in objects that the API does
# not have, and is named shared_thing_v2.
openapi: 3.1.0
info: {title: shared, version: 1.0.0}
paths:
  /shared/v1/things:
    post:
      tags: [Shared Things Service]
      operationId: SharedThingsService_CreateSharedThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SharedThing
              type: object
              oneOf:
                - {required: [byCount], type: object}
                - {required: [byRatio], type: object}
                - {type: object, not: {anyOf: [{required: [byCount], type: object}, {required: [byRatio], type: object}]}}
              properties:
                id: {type: string, x-coralogix-presence: true}
                name: {type: string}
                note: {type: string, x-coralogix-presence: true}
                size: {type: number, format: float, x-coralogix-presence: true}
                frame: {$ref: '#/components/schemas/SharedFrame'}
                byCount: {$ref: '#/components/schemas/SharedCount'}
                byRatio: {$ref: '#/components/schemas/SharedRatio'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateSharedThingResponse'}
    put:
      tags: [Shared Things Service]
      operationId: SharedThingsService_ReplaceSharedThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SharedThing
              type: object
              oneOf:
                - {required: [byCount], type: object}
                - {required: [byRatio], type: object}
                - {type: object, not: {anyOf: [{required: [byCount], type: object}, {required: [byRatio], type: object}]}}
              properties:
                id: {type: string, x-coralogix-presence: true}
                name: {type: string}
                note: {type: string, x-coralogix-presence: true}
                size: {type: number, format: float, x-coralogix-presence: true}
                frame: {$ref: '#/components/schemas/SharedFrame'}
                byCount: {$ref: '#/components/schemas/SharedCount'}
                byRatio: {$ref: '#/components/schemas/SharedRatio'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplaceSharedThingResponse'}
  /shared/v1/things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Shared Things Service]
      operationId: SharedThingsService_GetSharedThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetSharedThingResponse'}
    delete:
      tags: [Shared Things Service]
      operationId: SharedThingsService_DeleteSharedThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteSharedThingResponse'}
components:
  schemas:
    CreateSharedThingResponse:
      type: object
      required: [thing]
      properties:
        changedIds: {type: array, items: {type: string}}
        thing: {$ref: '#/components/schemas/SharedThing'}
    GetSharedThingResponse:
      type: object
      required: [thing]
      properties:
        thing: {$ref: '#/components/schemas/SharedThing'}
    ReplaceSharedThingResponse:
      type: object
      required: [thing]
      properties:
        changedIds: {type: array, items: {type: string}}
        thing: {$ref: '#/components/schemas/SharedThing'}
    DeleteSharedThingResponse:
      type: object
      required: []
    SharedThing:
      title: SharedThing
      type: object
      oneOf:
        - {required: [byCount], type: object}
        - {required: [byRatio], type: object}
        - {type: object, not: {anyOf: [{required: [byCount], type: object}, {required: [byRatio], type: object}]}}
      properties:
        id: {type: string, x-coralogix-presence: true}
        name: {type: string}
        note: {type: string, x-coralogix-presence: true}
        size: {type: number, format: float, x-coralogix-presence: true}
        frame: {$ref: '#/components/schemas/SharedFrame'}
        byCount: {$ref: '#/components/schemas/SharedCount'}
        byRatio: {$ref: '#/components/schemas/SharedRatio'}
    SharedFrame:
      type: string
      enum: [SHARED_FRAME_UNSPECIFIED, SHARED_FRAME_ONE_DAY, SHARED_FRAME_SEVEN_DAYS]
    SharedCount:
      type: object
      properties:
        limit: {type: integer, format: int32, x-coralogix-presence: true}
    SharedRatio:
      type: object
      properties:
        ratio: {type: number, format: float, x-coralogix-presence: true}
