# Overrides (D21) for the switch of coralogix_alert: the generated
# alertdeftypes give the schema of the handwritten resource, so no
# configuration or state changes. By kind:
#   - shape: wrap (type_definition, incidents and webhook retriggering_period),
#     inline (anomaly settings, routing overrides, the webhook integration),
#     unwrap (time windows, tracing filter, flow groups, recipients), custom
#     (of_the_last, latency_threshold_ms, override.priority: see
#     add/alertcustom), namesArm (type), skip (activeOn: the schedule stays
#     handwritten; the analytics types and notificationGroupExcess come in
#     the second step);
#   - flags, defaults, defaultObject, set, renames, int64, string, wide;
#   - reading a response like the handwritten code (missingAsZero,
#     emptyAsNull), found by equivalence_test.go.txt;
#   - enums: the Terraform names of the handwritten maps (alert_types).
types:
  AlertDefProperties:
    type_definition:
      wrap: [flow, logsAnomaly, logsImmediate, logsNewValue, logsRatioThreshold, logsThreshold, logsTimeRelativeThreshold, logsUniqueCount, metricAnomaly, metricThreshold, sloThreshold, tracingImmediate,
        tracingThreshold]
      required: true
    entityLabels: {name: labels, emptyAsNull: true}
    groupByKeys: {name: group_by, computed: true}
    analyticsImmediate: {skip: true}
    analyticsThreshold: {skip: true}
    notificationGroupExcess: {skip: true}
    type: {namesArm: true}
    name: {required: true}
    enabled: {default: 'true'}
    phantomMode: {default: 'false'}
    deleted: {readOnly: true, useStateForUnknown: true}
    priority: {computed: true, useStateForUnknown: true, missingAsZero: true}
    incidentsSettings: {computed: true, useStateForUnknown: true}
    notificationGroup: {defaultObject: true}
    activeOn: {skip: true}
    dataSources: {emptyAsNull: true}
  LogsAnomalyType:
    anomalyAlertSettings: {inline: true}
    notificationPayloadFilter: {set: true, emptyAsNull: true}
    rules: {set: true, required: true}
    evaluationDelayMs: {name: custom_evaluation_delay}
    logsFilter: {computed: true, useStateForUnknown: true}
  MetricAnomalyType:
    anomalyAlertSettings: {inline: true}
    rules: {set: true, required: true}
    evaluationDelayMs: {name: custom_evaluation_delay}
  NotificationRouting:
    configOverrides: {inline: true}
  v3.SourceOverrides:
    connectorConfigFields: {name: connector_overrides}
    messageConfigFields: {name: preset_overrides}
    payloadType: {required: true}
  FlowStages:
    timeframeMs: {int64: true, default: '0'}
    flowStagesGroups: {required: true}
    timeframeType: {missingAsZero: true}
  LogsUniqueCountCondition:
    maxUniqueCount: {int64: true}
  LogsUniqueCountType:
    maxUniqueCountPerGroupByKey: {int64: true}
    notificationPayloadFilter: {set: true, emptyAsNull: true}
    rules: {set: true, required: true}
    logsFilter: {computed: true, useStateForUnknown: true}
  TimeDuration:
    duration: {int64: true}
  TracingSimpleFilter:
    latencyThresholdMs:
      custom: {type: Number, shape: c9ffc148226b}
  MetricThresholdCondition:
    ofTheLast:
      custom: {type: String, shape: 1dd67adb0272}
    conditionType: {missingAsZero: true}
  MetricAnomalyCondition:
    ofTheLast:
      custom: {type: String, shape: 1dd67adb0272}
    conditionType: {missingAsZero: true}
  AlertDefOverride:
    priority:
      custom: {type: String, shape: 711424a7049a}
  AlertDefDataSource:
    dataSet: {required: true}
    dataSpace: {required: true}
  AlertDefIncidentSettings:
    retriggering_period:
      wrap: [minutes]
      required: true
    notifyOn: {required: true, missingAsZero: true}
    minutes: {required: true}
  NotificationDestination:
    connectorId: {required: true}
    presetId: {required: true}
    notifyOn: {default: Triggered Only, missingAsZero: true}
    resolvedRouteOverrides: {name: resolved_routing_overrides}
  v3.ConnectorConfigField:
    fieldName: {required: true}
    template: {required: true}
  v3.MessageConfigField:
    fieldName: {required: true}
    template: {required: true}
  NotificationRouter:
    id: {default: '', missingAsZero: true}
    notifyOn: {default: Triggered Only, missingAsZero: true}
  AlertDefNotificationGroup:
    webhooks: {name: webhooks_settings, set: true, emptyAsNull: true}
    destinations: {emptyAsNull: true}
    groupByKeys: {emptyAsNull: true}
  AlertDefWebhooksSettings:
    retriggering_period:
      wrap: [minutes]
      computed: true
      useStateForUnknown: true
    minutes: {required: true}
    notifyOn: {computed: true, useStateForUnknown: true}
    integration: {inline: true}
  v3.IntegrationType:
    integrationId: {string: true}
  Recipients:
    emails: {set: true}
  LogsImmediateType:
    notificationPayloadFilter: {set: true, emptyAsNull: true}
    logsFilter: {computed: true, useStateForUnknown: true}
  LogsNewValueType:
    notificationPayloadFilter: {set: true, emptyAsNull: true}
    rules: {set: true, required: true}
    logsFilter: {computed: true, useStateForUnknown: true}
  LogsRatioThresholdType:
    notificationPayloadFilter: {set: true, emptyAsNull: true}
    rules: {set: true, required: true}
    evaluationDelayMs: {name: custom_evaluation_delay}
    numerator: {computed: true, useStateForUnknown: true}
    denominator: {computed: true, useStateForUnknown: true}
    groupByFor: {default: Both, missingAsZero: true}
    ignoreInfinity: {default: 'false'}
    undetectedValuesManagement: {useStateForUnknown: true, defaultObject: true, missingAsZero: true}
  LogsThresholdType:
    notificationPayloadFilter: {set: true, emptyAsNull: true}
    rules: {set: true, required: true}
    evaluationDelayMs: {name: custom_evaluation_delay}
    logsFilter: {computed: true, useStateForUnknown: true}
    undetectedValuesManagement: {useStateForUnknown: true, defaultObject: true, missingAsZero: true}
    noDataPolicy: {computed: true, useStateForUnknown: true, missingAsZero: true}
  LogsTimeRelativeThresholdType:
    notificationPayloadFilter: {set: true, emptyAsNull: true}
    rules: {set: true, required: true}
    evaluationDelayMs: {name: custom_evaluation_delay}
    logsFilter: {computed: true, useStateForUnknown: true}
    ignoreInfinity: {default: 'false'}
    undetectedValuesManagement: {useStateForUnknown: true, defaultObject: true, missingAsZero: true}
  TracingImmediateType:
    notificationPayloadFilter: {set: true, emptyAsNull: true}
  TracingThresholdType:
    notificationPayloadFilter: {set: true, emptyAsNull: true}
    rules: {set: true, required: true}
  MetricThresholdType:
    rules: {set: true, required: true}
    evaluationDelayMs: {name: custom_evaluation_delay}
    undetectedValuesManagement: {useStateForUnknown: true, defaultObject: true, missingAsZero: true}
    noDataPolicy: {computed: true, useStateForUnknown: true, missingAsZero: true}
  v3.UndetectedValuesManagement:
    autoRetireTimeframe: {default: NEVER, missingAsZero: true}
    triggerUndetectedValues: {default: 'false', missingAsZero: true}
  NoDataPolicy:
    state: {computed: true}
    autoRetireSeconds: {wide: true}
  v3.LogsFilter:
    simpleFilter: {computed: true, useStateForUnknown: true}
  LogsSimpleFilter:
    luceneQuery: {default: '', missingAsZero: true}
    labelFilters: {defaultObject: true}
  LabelFilters:
    applicationName: {set: true, emptyAsNull: true}
    subsystemName: {set: true, emptyAsNull: true}
    severities: {set: true, emptyAsNull: true}
  LabelFilterType:
    operation: {default: IS}
  TracingLabelFilters:
    applicationName: {set: true, emptyAsNull: true}
    subsystemName: {set: true, emptyAsNull: true}
    serviceName: {set: true, emptyAsNull: true}
    operationName: {set: true, emptyAsNull: true}
    spanFields: {set: true, emptyAsNull: true}
  TracingFilterType:
    values: {set: true, required: true}
    operation: {default: IS}
  FlowType:
    enforceSuppression: {default: 'false'}
  FlowStagesGroup:
    alertDefs: {required: true, set: true, emptyAsNull: true}
    alertsOp: {required: true, missingAsZero: true}
    nextOp: {required: true, missingAsZero: true}
  FlowStagesGroupsAlertDefs:
    not: {default: 'false'}
  AnomalyAlertSettings:
    percentageOfDeviation: {wide: true}
  LogsAnomalyCondition:
    conditionType: {optional: false, default: MORE_THAN_USUAL, useStateForUnknown: true, missingAsZero: true}
  TracingThresholdCondition:
    conditionType: {optional: false, default: MORE_THAN, useStateForUnknown: true, missingAsZero: true}
  LogsThresholdCondition:
    conditionType: {missingAsZero: true}
  LogsRatioCondition:
    conditionType: {missingAsZero: true}
  LogsTimeRelativeCondition:
    conditionType: {missingAsZero: true}
    comparedTo: {missingAsZero: true}
  LogsTimeWindow:
    logsTimeWindowSpecificValue: {missingAsZero: true}
  LogsNewValueTimeWindow:
    logsNewValueTimeWindowSpecificValue: {missingAsZero: true}
  LogsRatioTimeWindow:
    logsRatioTimeWindowSpecificValue: {missingAsZero: true}
  LogsUniqueValueTimeWindow:
    logsUniqueValueTimeWindowSpecificValue: {missingAsZero: true}
  TracingTimeWindow:
    tracingTimeWindowValue: {missingAsZero: true}
unwrap: [TracingFilter, LogsTimeWindow, LogsNewValueTimeWindow, LogsRatioTimeWindow, LogsUniqueValueTimeWindow, TracingTimeWindow, Recipients, FlowStagesGroups]
customPackage: github.com/coralogix/terraform-provider-coralogix/internal/provider/alerts/alertcustom
