# Overrides (D21) for the switch of the dynamic widget of coralogix_dashboard:
# the generated dynamictypes give the schema of the handwritten
# definition.dynamic, so no configuration or state changes. By kind:
#   - shape: typeStrings (colors_by as a string; the logs and spans
#     aggregations as type and the arm fields), bool (empty objects such as
#     min_max.auto), unwrap (the query values), custom (the filter
#     operators, the span field, and time_frame: see add/dynamiccustom),
#     skip (the deprecated top-level query, which the handwritten resource
#     rejects; two new geomap region configs come in the second step);
#   - flags, defaults ("unspecified" for most enums), renames, int64,
#     deprecation messages, wideNumbers;
#   - enums: the Terraform names of the handwritten maps (dashboard_widgets).
wideNumbers: true
unwrap: [LuceneQuery, PromQlQuery, UUID, common.DataprimeQuery]
typeStrings:
  ColorsBy: {plain: true}
  LogsAggregation: {names: {average: avg}}
customPackage: github.com/coralogix/terraform-provider-coralogix/internal/provider/dashboards/dashboard_widgets/dynamiccustom
types:
  Filter.LogsFilter:
    operator: {custom: {type: Object, shape: ff7271ae4722}}
  SpansFilter:
    operator: {custom: {type: Object, shape: ff7271ae4722}}
    field: {custom: {type: Object, shape: 84bbd5207862}}
  GeomapAggregation:
    count: {bool: true}
  MinMax:
    auto: {bool: true}
  SortStrategy:
    strategyType: {computed: true}
    category: {bool: true}
  StatVisualElement:
    templateVariables: {emptyAsNull: true}
    mappedValues: {bool: true}
  DisplayNameTemplateVariable:
    mappedValues: {bool: true}
  TimeSeriesLines:
    valueFields: {emptyAsNull: true}
    categoryFields: {emptyAsNull: true}
    scaleType: {default: unspecified}
    stackedLine: {default: unspecified}
    unit: {default: unspecified}
    xAxisTimeFormat: {default: unspecified}
    seriesCountLimit: {int64: true}
  QueryDisplaySettings:
    valueFields: {emptyAsNull: true}
    categoryFields: {emptyAsNull: true}
    scaleType: {default: unspecified}
    unit: {default: unspecified}
    seriesCountLimit: {int64: true}
  Dataprime:
    dataModeType: {default: unspecified}
    dataprimeQuery: {name: query}
  Dynamic.Query:
    dataprime: {name: data_prime}
  Logs:
    groupBy: {emptyAsNull: true}
    filters: {emptyAsNull: true}
    dataModeType: {default: unspecified}
    aggregation: {name: aggregations, emptyAsNull: true}
  Spans:
    groupBy: {emptyAsNull: true}
    filters: {emptyAsNull: true}
    dataModeType: {default: unspecified}
    aggregation: {name: aggregations, emptyAsNull: true}
  ColorLabelMapping:
    colorBy: {default: unspecified}
  Dynamic.QueryDefinition:
    id: {required: false, optional: true, computed: true, useNonNullStateForUnknown: true}
  Geomap:
    minMax: {emptyAsNull: true}
    config: {emptyAsNull: true}
    color: {emptyAsNull: true}
    aggregation: {emptyAsNull: true}
    unit: {default: unspecified}
  Heatmap:
    yAxisFields: {emptyAsNull: true}
    xAxisFields: {emptyAsNull: true}
    histogramBucketUnit: {default: unspecified}
    scaleType: {default: unspecified}
    unit: {default: unspecified}
    xAxisTimeFormat: {default: unspecified}
  HexagonBins:
    thresholds: {emptyAsNull: true}
    categoryFields: {emptyAsNull: true}
    legendBy: {default: unspecified}
    thresholdType: {default: unspecified}
    unit: {default: unspecified}
  HorizontalBars:
