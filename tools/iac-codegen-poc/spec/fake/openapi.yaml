openapi: 3.1.0
info:
  title: Fake Boards API
  version: "1"
  description: >-
    A fake API that follows the full IaC contract. It exists only to test the
    generator on shapes that the real API does not have. No server implements it.
tags:
  - name: Fake Boards Service
paths:
  /fake/boards/v1:
    post:
      description: Creates a board.
      operationId: FakeBoardsService_CreateFakeBoard
      tags:
        - Fake Boards Service
      requestBody:
        content:
          application/json:
            schema:
              description: Request to create a board.
              properties:
                name:
                  description: Name of the board.
                  maxLength: 64
                  minLength: 1
                  type: string
                description:
                  description: Free text about the board.
                  maxLength: 256
                  type: string
                  x-coralogix-presence: true
                flags:
                  additionalProperties:
                    type: boolean
                  description: Feature flags. A map of bools.
                  type: object
                  x-coralogix-presence: true
                publicLink:
                  allOf:
                    - $ref: '#/components/schemas/PublicLink'
                  description: Share by a public link. A oneOf arm at the resource root.
                  x-coralogix-presence: true
                privateShare:
                  allOf:
                    - $ref: '#/components/schemas/PrivateShare'
                  description: Share with a team. A oneOf arm at the resource root.
                  x-coralogix-presence: true
                labels:
                  additionalProperties:
                    type: string
                  description: Labels of the board. A map of strings.
                  type: object
                  x-coralogix-presence: true
                panels:
                  additionalProperties:
                    $ref: '#/components/schemas/Panel'
                  description: Panels by id. A map of objects.
                  type: object
                  x-coralogix-presence: true
                layout:
                  allOf:
                    - $ref: '#/components/schemas/Layout'
                  description: How the board looks.
              type: object
              required:
                - name
                - layout
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFakeBoardResponse'
          description: ''
  /fake/boards/v1/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      description: Gets a board.
      operationId: FakeBoardsService_GetFakeBoard
      tags:
        - Fake Boards Service
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFakeBoardResponse'
          description: ''
    patch:
      description: Updates a board.
      operationId: FakeBoardsService_UpdateFakeBoard
      tags:
        - Fake Boards Service
      requestBody:
        content:
          application/json:
            schema:
              description: Request to update a board.
              properties:
                description:
                  description: Free text about the board.
                  maxLength: 256
                  type: string
                  x-coralogix-presence: true
                flags:
                  additionalProperties:
                    type: boolean
                  description: Feature flags. A map of bools.
                  type: object
                  x-coralogix-presence: true
                publicLink:
                  allOf:
                    - $ref: '#/components/schemas/PublicLink'
                  description: Share by a public link. A oneOf arm at the resource root.
                  x-coralogix-presence: true
                privateShare:
                  allOf:
                    - $ref: '#/components/schemas/PrivateShare'
                  description: Share with a team. A oneOf arm at the resource root.
                  x-coralogix-presence: true
                labels:
                  additionalProperties:
                    type: string
                  description: Labels of the board. A map of strings.
                  type: object
                  x-coralogix-presence: true
                panels:
                  additionalProperties:
                    $ref: '#/components/schemas/Panel'
                  description: Panels by id. A map of objects.
                  type: object
                  x-coralogix-presence: true
                layout:
                  allOf:
                    - $ref: '#/components/schemas/Layout'
                  description: How the board looks.
                  x-coralogix-presence: true
                updateMask:
                  description: >-
                    Comma-separated list of field paths to update. A path can
                    name a nested field, for example layout.section.header.text.
                  maxLength: 1024
                  minLength: 1
                  pattern: ^[a-zA-Z_][a-zA-Z0-9_]*(\.[a-zA-Z_][a-zA-Z0-9_]*)*(,[a-zA-Z_][a-zA-Z0-9_]*(\.[a-zA-Z_][a-zA-Z0-9_]*)*)*$
                  type: string
              type: object
              required: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFakeBoardResponse'
          description: ''
    delete:
      description: Deletes a board.
      operationId: FakeBoardsService_DeleteFakeBoard
      tags:
        - Fake Boards Service
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFakeBoardResponse'
          description: ''
components:
  schemas:
    FakeBoard:
      type: object
      oneOf:
        - required: [publicLink]
          type: object
        - required: [privateShare]
          type: object
        - not:
            anyOf:
              - required: [publicLink]
                type: object
              - required: [privateShare]
                type: object
          type: object
      properties:
        publicLink:
          allOf:
            - $ref: '#/components/schemas/PublicLink'
          description: Share by a public link. A oneOf arm at the resource root.
        privateShare:
          allOf:
            - $ref: '#/components/schemas/PrivateShare'
          description: Share with a team. A oneOf arm at the resource root.
        id:
          description: Unique identifier of the board.
          type: string
        name:
          description: Name of the board.
          maxLength: 64
          minLength: 1
          type: string
        description:
          description: Free text about the board.
          maxLength: 256
          type: string
        flags:
          additionalProperties:
            type: boolean
          description: Feature flags. A map of bools.
          type: object
        labels:
          additionalProperties:
            type: string
          description: Labels of the board. A map of strings.
          type: object
        panels:
          additionalProperties:
            $ref: '#/components/schemas/Panel'
          description: Panels by id. A map of objects.
          type: object
        layout:
          allOf:
            - $ref: '#/components/schemas/Layout'
          description: How the board looks.
        updatedAt:
          description: RFC3339 timestamp of the last update.
          format: date-time
          type: string
      required:
        - id
        - name
    Layout:
      description: How the board looks. Level 1. It has two oneOf groups.
      type: object
      allOf:
        - oneOf:
            - required: [refreshOff]
              type: object
            - required: [refreshEvery]
              type: object
            - not:
                anyOf:
                  - required: [refreshOff]
                    type: object
                  - required: [refreshEvery]
                    type: object
              type: object
        - oneOf:
            - required: [absoluteTime]
              type: object
            - required: [relativeTime]
              type: object
      properties:
        refreshOff:
          allOf:
            - $ref: '#/components/schemas/BoldStyle'
          description: No auto refresh. Group 1 (none allowed).
        refreshEvery:
          allOf:
            - $ref: '#/components/schemas/Every'
          description: Refresh every n minutes. Group 1.
        absoluteTime:
          allOf:
            - $ref: '#/components/schemas/AbsoluteTime'
          description: A fixed time range. Group 2 (one arm required).
        relativeTime:
          allOf:
            - $ref: '#/components/schemas/Every'
          description: The last n minutes. Group 2.
        title:
          description: Title of the board.
          type: string
        titleStyle:
          allOf:
            - $ref: '#/components/schemas/TextStyle'
          description: Style of the title. The same type as the header style.
        section:
          allOf:
            - $ref: '#/components/schemas/Section'
          description: The main section.
      required:
        - title
    Section:
      description: A section of the board. Level 2.
      type: object
      properties:
        header:
          allOf:
            - $ref: '#/components/schemas/Header'
          description: The section header.
        widths:
          additionalProperties:
            format: uint64
            pattern: ^[0-9]+$
            type: string
          description: Column widths by column name. A map of 64-bit numbers inside a nested object.
          type: object
        interval:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: Time bucket. A oneOf with a normal field beside the arms.
        columns:
          description: Column numbers. A list of int32.
          items:
            format: int32
            type: integer
          type: array
        ratios:
          description: Column ratios. A list of 32-bit floats.
          items:
            format: float
            type: number
          type: array
        rows:
          description: The rows of the section, in order.
          items:
            $ref: '#/components/schemas/Row'
          type: array
    Header:
      description: A section header. Level 3.
      type: object
      properties:
        text:
          description: Header text.
          minLength: 1
          type: string
        color:
          allOf:
            - $ref: '#/components/schemas/Color'
          description: Header color.
        style:
          allOf:
            - $ref: '#/components/schemas/TextStyle'
          description: Style of the header text.
      required:
        - text
    Row:
      description: One row of a section.
      type: object
      properties:
        height:
          description: Height in grid units.
          format: uint64
          pattern: ^[0-9]+$
          type: string
        label:
          description: Row label.
          type: string
        offset:
          description: Vertical offset. A signed 64-bit number (int64).
          format: int64
          maximum: 100
          minimum: -100
          type: integer
        style:
          allOf:
            - $ref: '#/components/schemas/TextStyle'
          description: Style of the row label. A oneOf inside a list item.
      required:
        - height
    TextStyle:
      description: Text style (oneof).
      type: object
      properties:
        bold:
          allOf:
            - $ref: '#/components/schemas/BoldStyle'
          description: Bold text (no fields).
        font:
          allOf:
            - $ref: '#/components/schemas/FontStyle'
          description: A font.
      oneOf:
        - required:
            - bold
          type: object
        - required:
            - font
          type: object
        - not:
            anyOf:
              - required:
                  - bold
                type: object
              - required:
                  - font
                type: object
          type: object
    BoldStyle:
      description: Bold text. It has no fields.
      type: object
    FontStyle:
      description: A font.
      type: object
      properties:
        family:
          description: Font family.
          type: string
        scale:
          description: Font scale. A 32-bit float.
          format: float
          type: number
        size:
          description: Font size in points.
          format: uint64
          pattern: ^[0-9]+$
          type: string
    Interval:
      description: A time bucket. The arms auto and manual (one is required), and the normal field useLimit.
      type: object
      properties:
        auto:
          allOf:
            - $ref: '#/components/schemas/BoldStyle'
          description: Pick the bucket automatically.
        manual:
          allOf:
            - $ref: '#/components/schemas/Every'
          description: A fixed bucket.
        useLimit:
          description: A normal field beside the arms.
          type: boolean
      oneOf:
        - required: [auto]
          type: object
        - required: [manual]
          type: object
    Every:
      description: A number of minutes.
      type: object
      properties:
        minutes:
          description: Minutes.
          format: int32
          type: integer
    AbsoluteTime:
      description: A fixed time range.
      type: object
      properties:
        from:
          description: Start, RFC3339.
          type: string
        to:
          description: End, RFC3339.
          type: string
    PublicLink:
      description: A public link.
      type: object
      properties:
        url:
          description: The link.
          type: string
    PrivateShare:
      description: Shared with a team.
      type: object
      properties:
        team:
          description: The team.
          type: string
    Panel:
      description: A panel. A value of the panels map.
      type: object
      properties:
        query:
          description: The panel query.
          minLength: 1
          type: string
        precision:
          description: Digits after the point. A 32-bit integer (int32).
          format: int32
          maximum: 10
          minimum: 0
          type: integer
        thresholds:
          additionalProperties:
            format: double
            type: number
          description: Thresholds by name. A map of numbers.
          type: object
        unit:
          allOf:
            - $ref: '#/components/schemas/Unit'
          description: The unit of the values.
        style:
          allOf:
            - $ref: '#/components/schemas/TextStyle'
          description: Style of the panel title. A oneOf inside a map value.
      required:
        - query
    Unit:
      enum:
        - PERCENT
        - BYTES
      type: string
      description: A unit.
    Color:
      enum:
        - RED
        - GREEN
        - BLUE
      type: string
      description: A color.
    CreateFakeBoardResponse:
      type: object
      properties:
        fakeBoard:
          allOf:
            - $ref: '#/components/schemas/FakeBoard'
          description: The created board.
    GetFakeBoardResponse:
      type: object
      properties:
        fakeBoard:
          allOf:
            - $ref: '#/components/schemas/FakeBoard'
          description: The board.
    UpdateFakeBoardResponse:
      type: object
      properties:
        fakeBoard:
          allOf:
            - $ref: '#/components/schemas/FakeBoard'
          description: The updated board.
    DeleteFakeBoardResponse:
      type: object
      properties:
        id:
          description: Identifier of the deleted board.
          type: string
