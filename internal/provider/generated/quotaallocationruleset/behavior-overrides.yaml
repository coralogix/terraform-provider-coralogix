# Where coralogix_quota_allocation_rule_set differs from the API contract, because users already have it.
resource: QuotaAllocationEntityTypeRuleSet
mode: existing
typeName: quota_allocation_rule_set

markdownDescription: "Manages the account-level Coralogix quota allocation rule set. This API is a singleton overwrite surface: updates replace the full rule set. Delete clears customer-managed rules only; Coralogix-managed (`cx_managed`) rules are preserved. This resource filters `cx_managed` rules out of state; the data source exposes them. Requires `team-quota-rules:Read` and `team-quota-rules:Manage` permissions. Rules are keyed by entity type, such as `logs`, `spans`, or `metrics`. The [Quota Rules](https://coralogix.com/docs/user-guides/account-management/payment-and-billing/quota-rules/) documentation lists the supported entity types; the Coralogix API rejects an unsupported one."

# The contract limits are the released validators: entity_type has a length of at least 1, and
# allocation is at least 0.
validators:
  inferred: true

# The rule set has the id of the API, and it is a singleton: no call takes an id.
singletonID: {fromAPI: true}

api:
  # Create and Replace send {"ruleSet": {...}}.
  requestWrapper: ruleSet
  operations:
    create: QuotaAllocationRuleSetService_CreateQuotaAllocationRuleSet
    get: QuotaAllocationRuleSetService_GetQuotaAllocationRuleSet
    update: QuotaAllocationRuleSetService_ReplaceQuotaAllocationRuleSet
    delete: QuotaAllocationRuleSetService_DeleteQuotaAllocationRuleSet

types:
  QuotaAllocationEntityTypeRuleSet:
    fields:
      id:
        readOnly: true
        markdownDescription: "The backend identifier for the quota allocation rule set. Import accepts this value or `quota-allocation-rule-set`."
      rules:
        # The contract does not require it, because [] is a valid rule set. The released resource does.
        required: true
        # The API rejects two rules for one entity type.
        uniqueBy: entityType
        markdownDescription: "Complete set of customer-managed quota allocation rules. Because the backend stores a single account-level rule set, Terraform replaces the full customer-managed set during update. Set `rules = []` to clear all customer-managed rules."
  QuotaAllocationEntityTypeRule:
    fields:
      entityType:
        markdownDescription: "Entity type covered by the rule, such as `logs`, `spans`, or `metrics`. The [Quota Rules](https://coralogix.com/docs/user-guides/account-management/payment-and-billing/quota-rules/) documentation lists the supported entity types; the Coralogix API rejects an unsupported one."
      # Zero and false are valid values, and the contract does not state their presence. Terraform sends them every time.
      allocation:
        required: true
        markdownDescription: "Quota allocation value for this entity type. For `percentage`, must be between 0 and 100. For `locked_units`, must be non-negative. The sum of enabled locked units plus any Coralogix bundle units must fit within the team daily quota."
      allocationType:
        computed: true
        default: percentage
        markdownDescription: "How the allocation value is interpreted. Valid values are `percentage` (default) and `locked_units`. `unspecified` is accepted as a compatible alias of `percentage` and is normalized to `percentage` during planning. Locked units are reserved first from the team daily quota; percentage rules share the remaining pool and their enabled allocations must sum to at most 100."
      enabled:
        required: true
        markdownDescription: "Whether the quota allocation rule is enabled."
      canOverflow:
        required: true
        markdownDescription: "Whether this entity type can overflow beyond its allocation."
      # The data source shows cx_managed. The resource keeps the rules that Coralogix manages out of state.
      cxManaged: {skip: true}

enums:
  # The API stores an unspecified type as percentage. The released resource accepts "unspecified" as an
  # alias, and the plan shows percentage.
  QuotaAllocationType:
    zero: unspecified
    aliases: {unspecified: percentage}
    trimPrefix: QUOTA_ALLOCATION_TYPE_
    values: [QUOTA_ALLOCATION_TYPE_PERCENTAGE, QUOTA_ALLOCATION_TYPE_LOCKED_UNITS]

# The data source reads the singleton. It has no configuration. It shows cx_managed on each rule, which the
# resource keeps out of its state, and it shows the rules that Coralogix manages. It only reads, so it
# keeps the descriptions of the released data source.
dataSource:
  description: >-
    Reads the current account-level Coralogix quota allocation rule set, including Coralogix-managed (`cx_managed`) rules that the resource filters out of state. Requires `team-quota-rules:Read` permission. Rules are keyed by entity type, such as `logs`, `spans`, or `metrics`. The [Quota Rules](https://coralogix.com/docs/user-guides/account-management/payment-and-billing/quota-rules/) documentation lists the supported entity types; the Coralogix API rejects an unsupported one.
  types:
    QuotaAllocationEntityTypeRuleSet:
      fields:
        id:
          description: The backend identifier for the quota allocation rule set.
        rules:
          description: Current quota allocation rules returned by the backend, including `cx_managed` rules.
    QuotaAllocationEntityTypeRule:
      fields:
        allocation:
          description: Quota allocation value for this entity type. For `percentage`, this is a share of the pool left after `locked_units`. For `locked_units`, this is a fixed reservation from the team daily quota. The sum of enabled locked units plus any Coralogix bundle units must fit within the team daily quota.
        allocationType:
          description: How the allocation value is interpreted. Valid values are `percentage` and `locked_units`. An API `UNSPECIFIED` value is returned as `percentage`.
        cxManaged:
          show: true
          description: Whether the quota allocation rule is managed by Coralogix. Customer Terraform configurations must not send edits that collide with a `cx_managed` rule for the same entity type. Delete clears customer-managed rules only.
