# Where coralogix_connector differs from the API contract, because users already have it.
#
# A field with a line here keeps its released behavior. A field without a line follows the
# API contract.
resource: Connector
mode: existing

markdownDescription: "Coralogix Notification Center Connector. For more info please review - https://coralogix.com/docs/user-guides/notification-center/connectors/. **Note:** This resource is in Beta stage."

schema:
  version: 0

validators:
  inferred: false

api:
  requestWrapper: connector
  updateIDInBody: true
  clientSetID: true

types:
  Connector:
    fields:
      id:
        markdownDescription: "Connector ID. Can be set by the user or generated by Coralogix. Requires recreation in case of change."
        useStateForUnknown: true
      name:
        markdownDescription: "Connector name."
        validators: [{lengthAtLeast: 1}]
      description:
        computed: true # the API returns "" for an omitted value
        markdownDescription: "Human-readable description. The API stores an omitted description as an empty string, so Terraform treats this field as Optional and Computed. To clear it, set `description = \"\"`. Removing `description` and `config_overrides` from the configuration together keeps both values: the server does not clear them on that update. Set `description = \"\"` and `config_overrides = []` to clear both."
      type:
        markdownDescription: "Connector type. Valid values are: unspecified, slack, generic_https, pagerduty, pagerduty_incidents, email, service_now, microsoft_teams, eventbridge, incident_io. `incident_io` is a preview type."
        validators: [{enum: true}]
      configOverrides:
        computed: true
      resolvedConnectorConfig:
        skip: true
      diagnostics:
        skip: true
      teamId:
        skip: true
      createTime:
        skip: true
      updateTime:
        skip: true

  ConnectorConfig:
    required: []
    fields:
      fields:
        required: true

  notification_center.ConnectorConfigField:
    fields:
      value:
        required: true

  Diagnostics:
    required: []

  EntityTypeConfigOverrides:
    fields:
      entityType:
        description: "Entity type for the connector. Valid values are: unspecified, alerts, cases, test_notifications."
        validators: [{enum: true}]
      fields:
        required: true

  TemplatedConnectorConfigField:
    fields:
      template:
        required: true

enums:
  Delivery:
    zero: unspecified
    values: [DISABLED, ERRORS_ONLY]
  notification_center.ConnectorType:
    zero: unspecified
    values: [SLACK, GENERIC_HTTPS, PAGERDUTY, SERVICE_NOW, EMAIL, PAGERDUTY_INCIDENTS, MICROSOFT_TEAMS, EVENTBRIDGE, INCIDENT_IO]
    rejected: [IBM_EVENT_NOTIFICATIONS]
  notification_center.EntityType:
    zero: unspecified
    values: [ALERTS, CASES, TEST_NOTIFICATIONS]
    rejected: [OLLY_SCHEDULED_TASKS]
