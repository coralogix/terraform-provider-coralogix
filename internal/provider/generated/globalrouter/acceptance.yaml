# What the generated acceptance test needs for coralogix_global_router, besides the schema.
# The test sets every attribute, imports, changes them, and sets the minimal config.
resource: GlobalRouter

# A router needs a connector for its targets. A generic HTTPS connector needs no integration, so
# the test needs no environment variable besides the API key.
prerequisites: |
  resource "coralogix_connector" "http" {
    id               = "@{run}-http"
    name             = "@{run}-http"
    type             = "generic_https"
    description      = "generic-https connector for the global router test"
    connector_config = {
      fields = [
        { field_name = "url", value = "https://api.staging.coralogix.net/mgmt/testing/tools/httpbin/post" },
        { field_name = "method", value = "post" },
      ]
    }
  }

values:
  rules[].condition: '"alertDef.priority == \"P1\""'
  rules[].targets[].connector_id: coralogix_connector.http.id
  fallback_targets[].target.connector_id: coralogix_connector.http.id
  # Label values become meta labels, which the API never deletes and limits per tenant, so a value
  # made up per run fills the limit. Routing labels are unique across routers, so these values
  # differ from those of the other router tests. One CI run at a time runs the live tests, but its
  # jobs run in parallel, so the upgrade test has its own values in upgradeValues.
  entity_labels: '{ key = "tf-acc-generated-global-router" }'
  routing_labels.environment: '"tf-acc-generated-global-router"'
  routing_labels.service: '"tf-acc-generated-global-router"'
  routing_labels.team: '"tf-acc-generated-global-router"'

updatedValues:
  entity_labels: '{ key = "tf-acc-generated-global-router-updated" }'
  routing_labels.environment: '"tf-acc-generated-global-router-updated"'
  routing_labels.service: '"tf-acc-generated-global-router-updated"'
  routing_labels.team: '"tf-acc-generated-global-router-updated"'

upgradeValues:
  routing_labels.environment: '"tf-acc-generated-global-router-upgrade"'
  routing_labels.service: '"tf-acc-generated-global-router-upgrade"'
  routing_labels.team: '"tf-acc-generated-global-router-upgrade"'

skip:
  - fallback                          # deprecated; the API refuses it next to fallback_targets
  - rules[].targets[].preset_id       # a preset is not needed for the connector
  - fallback_targets[].target.preset_id

# The API refuses a router without routing labels.
minimal:
  - routing_labels

# Provider 3.19.0 cannot create a router without a description.
upgradeMinimal:
  - description

upgradeFrom: "3.19.0"

# The routing labels above are pinned, so a router that a cancelled run left behind holds them, and
# every later create fails with "Routing labels already in use". Each subtest first deletes the
# routers that hold exactly the routing labels of its own configs.
leftovers: internal/acctest.RemoveLeftoverGlobalRouters
