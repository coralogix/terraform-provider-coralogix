# What the generated acceptance test needs for coralogix_team, besides the schema.
#
# The teams API needs a key whose owner is an organization: a team key gets 403. The CI key belongs
# to a team, so the team shard of .github/workflows/acceptance-tests.yml runs these tests with the
# CORALOGIX_ORG_API_KEY secret, and every other job skips them. To run them locally:
#
#   TF_ACC=1 CORALOGIX_API_KEY=<organization key> CORALOGIX_ENV=EU2 \
#     go test ./internal/provider/generated/team -run TestAccCoralogixResourceTeamGenerated
#
# The upgrade test also needs TF_ACC_PROVIDER_NAMESPACE=coralogix and
# CORALOGIX_GENERATED_UPGRADE_ACC=1.
#
# Every config sets daily_quota, and the updated config raises it. A team with the minimum quota
# (no daily_quota) cannot be deleted: Delete gives the quota back to the default team, and the API
# refuses to move 0.01 or less. A lower quota reads back 0.01 higher, because the API keeps 0.01
# on the team when it moves quota back. The quotas have seven decimals, so the test also shows that
# the read keeps the float32 that the API stores.
#
# The quotas are small because every team takes them from the default team of the organization,
# which must keep some quota itself: a Create that would leave it too little stores the minimum
# quota instead, and the apply fails. Each team that the tests create and delete also costs the
# default team 0.01.
resource: GetTeamResponse

values:
  daily_quota: "0.0534567"

updatedValues:
  daily_quota: "0.0645678"

minimal: [daily_quota]
upgradeMinimal: [daily_quota]
upgradeFrom: "3.24.0"
# 3.24.0 rounded the read to three decimals, so it fails on 0.0534567: the upgrade test gives it a
# quota that it can store.
upgradeValues:
  daily_quota: "0.05"
