resource: AiEvaluation
mode: existing

markdownDescription: "Coralogix AI evaluation."

validators:
  inferred: false

api:
  updateMaskInBody: true
  serverSetID: true # PINNED-SDK: the next API contract requires id in the response

# Update sends no updateMask, as the released resource did: the server updates
# every field present in the body.
updateMask: omit

types:
  AiEvaluation:
    fields:
      id:
        markdownDescription: "AI evaluation ID."
      application:
        required: true # PINNED-SDK: the next API contract requires it on create
        requiresReplace: true
        validators: [{lengthAtLeast: 1}]
      subsystem:
        required: true # PINNED-SDK: the next API contract requires it on create
        requiresReplace: true
        validators: [{lengthAtLeast: 1}]
      target:
        markdownDescription: "Target span content the evaluation runs against."
        required: true # PINNED-SDK: the next API contract requires it on create
        requiresReplace: true
        validators: [{enum: true}]
      threshold:
        required: true
        validators: [{between: [0, 1]}]
      isEnabled:
        markdownDescription: "Whether the evaluation is active."
        computed: true
        default: true
      config:
        markdownDescription: "AI evaluation configuration."
        required: true # PINNED-SDK: the next API contract requires it on create
        requireOne: true # PINNED-SDK: the next API contract requires one variant
      companyId: {skip: true}
      createdBy: {skip: true}
      createdAt: {skip: true}
      updatedAt: {skip: true}
  EvaluationConfig:
    unsupportedArms: [sqlLoad, customEvaluation]
    unsupportedSummary: "Unsupported AI evaluation config"
    unsupportedDetail: "Only Allowed Topics, Competition, Hallucination Completeness, Hallucination Context Adherence, Hallucination Context Relevance, Hallucination Correctness, Hallucination Task Adherence, Language Mismatch, PII, Prompt Injection, Restricted Topics, Sexism, SQL Allowed Tables, SQL Hallucination, SQL Read Only, SQL Restricted Tables, and Toxicity AI evaluation configs are currently supported by this resource."
  AllowedTopicsConfig:
    fields:
      topics: {required: true, collection: set, validators: [{sizeAtLeast: 1}]} # required and collection are PINNED-SDK: the next API contract requires the list and marks it UNORDERED_LIST
  RestrictedTopicsConfig:
    fields:
      topics: {required: true, collection: set, validators: [{sizeAtLeast: 1}]} # required and collection are PINNED-SDK: the next API contract requires the list and marks it UNORDERED_LIST
  CompetitionConfig:
    fields:
      competitors: {required: true, collection: set, validators: [{sizeAtLeast: 1}]} # required and collection are PINNED-SDK: the next API contract requires the list and marks it UNORDERED_LIST
  PiiConfig:
    fields:
      categories: {required: true, collection: set, validators: [{sizeAtLeast: 1}, {enum: true}]} # required and collection are PINNED-SDK: the next API contract requires the list and marks it UNORDERED_LIST
  SqlAllowedTablesConfig:
    fields:
      tables: {required: true, collection: set, validators: [{sizeAtLeast: 1}]} # required and collection are PINNED-SDK: the next API contract requires the list and marks it UNORDERED_LIST
  SqlRestrictedTablesConfig:
    fields:
      tables: {required: true, collection: set, validators: [{sizeAtLeast: 1}]} # required and collection are PINNED-SDK: the next API contract requires the list and marks it UNORDERED_LIST
  PromptInjectionConfig:
    fields:
      additionalContext:
        markdownDescription: "Additional context passed to the LLM evaluator."
        computed: true
        default: ""

enums:
  EvaluationTarget:
    values: [PROMPT, RESPONSE]
    rejected: [CONVERSATION]
    # The released resource read CONVERSATION into state as "conversation" but did not accept it in a configuration.
    readRejected: true
    readRejectedLower: true
  # The first value of the list items is a business value, not a zero value.
  PiiCategory:
    verbatim: true
    values: [PHONE_NUMBER, EMAIL_ADDRESS, CREDIT_CARD, IBAN_CODE, US_SSN]
