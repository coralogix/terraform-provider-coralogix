# What the generated acceptance test needs for coralogix_ai_evaluation, besides the schema.
#
# An evaluation belongs to an AI application that already exists in the tenant, and only one
# evaluation can use an application, a subsystem, and a target at a time. The API refuses a made-up
# application and no resource creates one, so the test reads an existing one from the environment:
# the CI team has 20 of them, which the preparation step of the acceptance workflow creates (see
# AI_EVALUATION_APPLICATION there). The handwritten TestAccCoralogixResourceAIEvaluation takes any
# free application of the tenant at random, but skips the one that these variables name, so the two
# never meet.
#
# The target is "prompt": every evaluation type accepts it, and prompt_injection accepts no other.
#
# To run it locally, name an application and a subsystem of your team that has no evaluation yet:
#
#   TF_ACC=1 CORALOGIX_API_KEY=<key> CORALOGIX_ENV=EU2 AI_EVALUATION_APPLICATION=<app> \
#     AI_EVALUATION_SUBSYSTEM=<subsystem> \
#     go test ./internal/provider/generated/aievaluation -run TestAccCoralogixResourceAiEvaluationGenerated
#
# A cancelled CI run leaves its evaluation behind, and the next create fails with 409, so every
# subtest first deletes the evaluations of this application (the handwritten tests never use it).
resource: AiEvaluation
leftovers: internal/acctest.RemoveLeftoverAiEvaluations
env: [AI_EVALUATION_APPLICATION, AI_EVALUATION_SUBSYSTEM]

values:
  application: '"@{env.AI_EVALUATION_APPLICATION}"'
  subsystem: '"@{env.AI_EVALUATION_SUBSYSTEM}"'
  target: '"prompt"'

# A step of values-and-choices holds one evaluation: several evaluations of the one application
# that one apply updates make the API fail with a 500 on some of the updates.
stepCopies: 1
