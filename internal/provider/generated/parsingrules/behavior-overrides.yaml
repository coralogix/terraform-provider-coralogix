# Where coralogix_parsing_rules differs from the API contract, because users already have it.
#
# A field with a line here keeps its released behavior. A field without a line follows the API
# contract.
resource: RuleGroup
mode: existing
typeName: parsing_rules

markdownDescription: "Coralogix log parsing rules. Parsing rules transform unstructured log data into structured fields at ingestion time. For more info please review - https://coralogix.com/docs/user-guides/data-transformation/parsing/log-parsing-rules/."

schema:
  version: 0

validators:
  inferred: false

api:
  operations:
    create: RuleGroupsService_CreateRuleGroup
    get: RuleGroupsService_GetRuleGroup
    update: RuleGroupsService_UpdateRuleGroup
    delete: RuleGroupsService_DeleteRuleGroup
  idProperty: id
  serverSetID: true

unwrap: [ApplicationNameConstraint, SubsystemNameConstraint, SeverityConstraint]

types:
  RuleGroup:
    fields:
      id: {readOnly: true, description: ""}
      teamId: {skip: true}
      name:
        required: true
        description: "Rule-group name"
      description:
        computed: true
        sendUnknownAsZero: true
        description: "Rule-group description"
      enabled:
        name: active
        computed: true
        sendUnknownAsZero: true
        description: "Determines whether the rule-group will be active."
      hidden:
        computed: true
        sendUnknownAsZero: true
        description: ""
      creator:
        computed: true
        sendUnknownAsZero: true
        description: "Rule-group creator."
      # Create sends an omitted order as 0, which adds the group last. An update keeps the order of the
      # state: the released resource sent 0 there too, and the API then moved the group after every
      # other group (recorded on EU2).
      order:
        computed: true
        sendUnknownAsZero: true
        useStateForUnknown: true
        description: "Determines the index of the rule-group between the other rule-groups. By default, will be added last. (1 based indexing). The value must be unique across every rule-group in the account. Terraform cannot enforce that, because rule-groups are separate resources that are planned in isolation, so two rule-groups sharing an order are only rejected - if at all - by the API. Removing order from the configuration keeps the current order; set a value to move the rule-group."
      ruleMatchers: {splitArms: true, collection: set, computed: true, default: []}
      ruleSubgroups:
        description: "List of rule-subgroups. Every rule-subgroup is a list of rules linked with a logical 'OR' (||) operation."
  RuleMatcher:
    fields:
      applicationName: {name: applications, description: "Rules will execute on logs that match the following applications."}
      subsystemName: {name: subsystems, description: "Rules will execute on logs that match the following subsystems."}
      severity:
        name: severities
        description: "Rules will execute on logs that match the these severities. Can be one of [\"critical\" \"debug\" \"error\" \"info\" \"verbose\" \"warning\"]"
        validators: [{enum: true}]
  RuleSubgroup:
    fields:
      id: {description: ""}
      enabled: {name: active, computed: true, default: true, description: ""}
      order: {position: true, description: ""}
      rules: {required: true, description: ""}
  rules.v1.Rule:
    fields:
      id: {description: "The rule id."}
      name: {required: true, description: "The rule name."}
      description: {computed: true, default: "", description: "The rule description."}
      enabled: {name: active, computed: true, default: true, description: "Determines whether the rule will be active or not."}
      order: {position: true, description: "Determines the index of the rule inside the rule-subgroup. Will be computed by the order it was declared (1-based indexing)."}
      sourceField:
        required: true
        markdownDescription: "The field on which the Regex will operate on. Accepts lowercase only."
      parameters:
        requireOne: true
        carrySiblings:
          requestValues:
            jsonExtractParameters: {sourceField: text}
            removeFieldsParameters: {sourceField: text}
          fold:
            allowParameters:
              into: blockParameters
              flag: block_all_matching_blocks
              markdownDescription: "Block Logic. If true or nor set - blocking all matching blocks, if false - blocking all non-matching blocks."
  RuleParameters:
    fields:
      parseParameters: {name: parse, description: ""}
      blockParameters: {name: block, description: ""}
      jsonExtractParameters: {name: json_extract, description: ""}
      replaceParameters: {name: replace, description: ""}
      extractTimestampParameters: {name: extract_timestamp, description: ""}
      removeFieldsParameters: {name: remove_fields, description: ""}
      jsonStringifyParameters: {name: json_stringify, description: ""}
      extractParameters: {name: extract, description: ""}
      jsonParseParameters: {name: parse_json_field, description: ""}
  ParseParameters:
    fields:
      destinationField: {required: true, markdownDescription: "The field that will be populated by the results of the RegEx operation."}
      rule: {name: regular_expression, required: true, markdownDescription: "Regular expiration. More info: https://coralogix.com/blog/regex-101/"}
  BlockParameters:
    fields:
      rule: {name: regular_expression, required: true, markdownDescription: "Regular expiration. More info: https://coralogix.com/blog/regex-101/"}
      keepBlockedLogs: {markdownDescription: "Determines if to view blocked logs in LiveTail and archive to S3."}
  AllowParameters:
    fields:
      rule: {name: regular_expression}
  JsonExtractParameters:
    fields:
      destinationFieldType:
        name: destination_field
        required: true
        validators: [{enum: true}]
        markdownDescription: "The field that will be populated by the results of RegEx operation.Can be one of [category class method severity text threadID] (case-insensitive)."
      destinationFieldText: {markdownDescription: "Required when destination_field is 'Text'. should be either 'text' or 'text.<some value>'"}
      rule: {name: json_key, required: true, description: "JSON key to extract its value directly into a Coralogix metadata field."}
  ReplaceParameters:
    fields:
      destinationField: {required: true, markdownDescription: "The field that will be populated by the results of the RegEx operation."}
      rule: {name: regular_expression, required: true, markdownDescription: "Regular expiration. More info: https://coralogix.com/blog/regex-101/"}
      replaceNewVal: {name: replacement_string, description: "The string that will replace the matched RegEx"}
  ExtractTimestampParameters:
    fields:
      standard:
        name: field_format_standard
        required: true
        validators: [{enum: true}]
        description: "The format standard you want to use. Can be one of [\"golang\" \"javaSDF\" \"microTS\" \"milliTS\" \"nanoTS\" \"secondTS\" \"strftime\"]"
      format: {name: time_format, required: true, description: "A time format that matches the field format standard"}
  RemoveFieldsParameters:
    fields:
      fields:
        name: excluded_fields
        required: true
        validators: [{sizeAtLeast: 1}]
        description: "Excluded fields won't be indexed."
  JsonStringifyParameters:
    fields:
      destinationField: {required: true, markdownDescription: "The field that will be populated by the results of the RegEx operation."}
      deleteSource: {name: keep_source_field, negate: true, computed: true, default: false, description: "Determines whether to keep or to delete the source field."}
  ExtractParameters:
    fields:
      rule: {name: regular_expression, required: true, markdownDescription: "Regular expiration. More info: https://coralogix.com/blog/regex-101/"}
  JsonParseParameters:
    fields:
      destinationField: {required: true, markdownDescription: "The field that will be populated by the results of the RegEx operation."}
      deleteSource: {name: keep_source_field, negate: true, computed: true, default: false, description: "Determines whether to keep or to delete the source field."}
      overrideDest: {name: keep_destination_field, negate: true, computed: true, default: true, description: "Determines whether to keep or to delete the destination field."}
      escapedValue: {requestValue: "true"}

enums:
  Value:
    zero: debug
    trimPrefix: VALUE_
    values: [VALUE_VERBOSE, VALUE_INFO, VALUE_WARNING, VALUE_ERROR, VALUE_CRITICAL]
  DestinationField:
    zero: category
    trimPrefix: DESTINATION_FIELD_
    values: [DESTINATION_FIELD_CLASSNAME, DESTINATION_FIELD_METHODNAME, DESTINATION_FIELD_THREADID, DESTINATION_FIELD_SEVERITY, DESTINATION_FIELD_TEXT]
    names: {DESTINATION_FIELD_CLASSNAME: class, DESTINATION_FIELD_METHODNAME: method, DESTINATION_FIELD_THREADID: threadID}
    caseInsensitive: true
  FormatStandard:
    zero: strftime
    trimPrefix: FORMAT_STANDARD_
    values: [FORMAT_STANDARD_JAVASDF, FORMAT_STANDARD_GOLANG, FORMAT_STANDARD_SECONDSTS, FORMAT_STANDARD_MILLITS, FORMAT_STANDARD_MICROTS, FORMAT_STANDARD_NANOTS]
    names: {FORMAT_STANDARD_JAVASDF: javaSDF, FORMAT_STANDARD_SECONDSTS: secondTS, FORMAT_STANDARD_MILLITS: milliTS, FORMAT_STANDARD_MICROTS: microTS, FORMAT_STANDARD_NANOTS: nanoTS}

dataSource: {}
