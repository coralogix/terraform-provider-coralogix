resource: DeployedIntegrationInformation
mode: existing
typeName: integration
markdownDescription: "A Coralogix Integration. Check https://coralogix.com/docs/developer-portal/infrastructure-as-code/terraform-provider/integrations/aws-metrics-collector/ for available options."
validators:
  inferred: false
api:
  requestWrapper: metadata
  updateIDInBody: true
  updateIDOutsideWrapper: true
  idProperty: id
  customMethods: true
  createResponseOnlyIDProperty: integrationId
  operations:
    create: IntegrationService_SaveIntegration
    get: IntegrationService_GetDeployedIntegration
    update: IntegrationService_UpdateIntegration
    delete: IntegrationService_DeleteIntegration
types:
  DeployedIntegrationInformation:
    fields:
      parameters: {skip: true, requestAs: integrationParameters.parameters}
      integrationStatus: {skip: true}
      id:
        markdownDescription: "Integration ID."
      definitionKey:
        name: integration_key
        requestAs: integrationKey
        requiresReplace: true
        markdownDescription: "Selector for the integration."
      definitionVersion:
        name: version
        requestAs: version
        markdownDescription: "The integration version"
    extraAttributes:
      parameters:
        dynamic: true
        required: true
        inUpdate: true
        markdownDescription: "Parameters required by the integration."

dataSource: {}
