# Generator overrides for coralogix_configuration_group.
resource: ConfigurationGroup
mode: existing
markdownDescription: 'Coralogix Fleet Management configuration group: the OpenTelemetry Collector configurations that matching agents receive. Its family is either `raw` (collector configurations you write) or `preset` (generated from a configuration template). Destroy archives the group. **Note:** This resource is in Beta stage.'
schema:
  version: 0
validators:
  inferred: false
api:
  # The API archives a configuration group instead of deleting it.
  delete:
    operation: ConfigurationGroupService_ArchiveConfigurationGroup
types:
  RemoteConfiguration:
    fields:
      rawConfiguration:
        equality: yaml
  PresetConfigurationFamily:
    fields:
      observabilityFeatures:
        equality: json
      integrationVersion:
        computed: true
  ConfigurationGroup:
    fields:
      priorityOrder:
        default: 0
        computed: true
  ConfigurationFamily:
    fields:
      active:
        default: false
        computed: true
  RawConfigurationFamily:
    fields:
      remoteConfigurations:
        keepPriorOrder: true
