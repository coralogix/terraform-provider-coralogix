# Generated acceptance test for coralogix_slo_v2. Every config uses the APM SLI, so the test covers
# its filters and their match_operator. An APM SLI needs a service that exists in the APM Service
# Catalog of the test account: CORALOGIX_SLO_V2_APM_SERVICE names it.
resource: Slo

env: [CORALOGIX_SLO_V2_APM_SERVICE]

values:
  name: '"@{run}-slo"'
  target_threshold_percentage: "99.5"
  sli.apm_sli.services: '["@{env.CORALOGIX_SLO_V2_APM_SERVICE}"]'
  sli.apm_sli.error_config: '{}'
  sli.apm_sli.filters[].key: '"http.status_code"'
  # The backend turns the grouping keys into a PromQL by (...) clause, so they must be label names.
  sli.apm_sli.grouping_keys: '["http_method"]'
  window.slo_time_frame: '"7_days"'
  product_type: '"apm"'
  labels: '{ team = "payments" }'
  ownership_tags.service.label_keys: '["service_name"]'
  ownership_tags.environment.static_values: '["production"]'
  ownership_tags.team.static_values: '["payments"]'

updatedValues:
  sli.apm_sli.grouping_keys: '["http_route"]'

# Each ownership tag takes static_values or label_keys, never both: the config sets one of them.
skip:
  - ownership_tags.service.static_values
  - ownership_tags.environment.label_keys
  - ownership_tags.team.label_keys

# An APM SLI is accepted only with product_type = "apm", so the minimal configs set it too.
minimal: [product_type]
upgradeMinimal: [product_type]

upgradeFrom: "3.21.0"
