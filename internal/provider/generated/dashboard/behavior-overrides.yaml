resource: Dashboard
mode: existing
markdownDescription: "Coralogix Custom Dashboard. For more info please review - https://coralogix.com/docs/user-guides/custom-dashboards/introduction/."
enumValuesInDescription: true
typeName: dashboard
readEmptyAs: "null"
schema:
  version: 4
  upgrade:
    1: {priorSchema: github.com/coralogix/terraform-provider-coralogix/internal/provider/dashboards/dashboard_schema.V1, strategy: refresh}
    2: {priorSchema: github.com/coralogix/terraform-provider-coralogix/internal/provider/dashboards/dashboard_schema.V2, strategy: refresh}
    3: {priorSchema: github.com/coralogix/terraform-provider-coralogix/internal/provider/dashboards/dashboard_schema.V3, strategy: refresh}
validators:
  inferred: false
modifyPlan: true
getHooks: true
dataSource: {}
api:
  operations:
    create: DashboardsService_CreateDashboard
    get: DashboardsService_GetDashboard
    update: DashboardsService_ReplaceDashboard
    delete: DashboardsService_DeleteDashboard
  requestWrapper: dashboard
  updateIDInBody: true
  idProperty: id
  createResponseOnlyIDProperty: dashboardId
  serverSetID: true
enums:
