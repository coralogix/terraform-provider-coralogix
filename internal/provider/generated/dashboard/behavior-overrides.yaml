    zero: unspecified
    values: [HEATMAP_COLOR_PRESET_BLUE, HEATMAP_COLOR_PRESET_GREEN, HEATMAP_COLOR_PRESET_RED, HEATMAP_COLOR_PRESET_THRESHOLD, HEATMAP_COLOR_PRESET_BLUE_REVERSED, HEATMAP_COLOR_PRESET_GREEN_REVERSED, HEATMAP_COLOR_PRESET_RED_REVERSED, HEATMAP_COLOR_PRESET_THRESHOLD_REVERSED]
  ScaleType:
