  MetricsSeriesLimitType:
    trimPrefix: METRICS_SERIES_LIMIT_TYPE_
    zero: unspecified
    values: [METRICS_SERIES_LIMIT_TYPE_BY_SERIES_COUNT, METRICS_SERIES_LIMIT_TYPE_BY_POINT_COUNT]
  OrderDirection:
    trimPrefix: ORDER_DIRECTION_
    zero: unspecified
    values: [ORDER_DIRECTION_ASC, ORDER_DIRECTION_DESC, ORDER_DIRECTION_NONE]
  MultiSelect.RefreshStrategy:
    trimPrefix: REFRESH_STRATEGY_
    zero: unspecified
    values: [REFRESH_STRATEGY_ON_DASHBOARD_LOAD, REFRESH_STRATEGY_ON_TIME_FRAME_CHANGE]
  DatasetScope:
    trimPrefix: DATASET_SCOPE_
    zero: unspecified
    values: [DATASET_SCOPE_USER_DATA, DATASET_SCOPE_LABEL, DATASET_SCOPE_METADATA]
  TextAlignment:
    trimPrefix: TEXT_ALIGNMENT_
    zero: unspecified
    values: [TEXT_ALIGNMENT_LEFT, TEXT_ALIGNMENT_CENTER, TEXT_ALIGNMENT_RIGHT]
  ValuesMappingType:
    trimPrefix: VALUES_MAPPING_TYPE_
    zero: unspecified
    values: [VALUES_MAPPING_TYPE_VALUE, VALUES_MAPPING_TYPE_REGEX]
  FieldDataType:
    trimPrefix: FIELD_DATA_TYPE_
    zero: unspecified
    values: [FIELD_DATA_TYPE_NUMBER, FIELD_DATA_TYPE_STRING, FIELD_DATA_TYPE_BOOLEAN, FIELD_DATA_TYPE_TIMESTAMP, FIELD_DATA_TYPE_OBJECT, FIELD_DATA_TYPE_ARRAY, FIELD_DATA_TYPE_REGEX, FIELD_DATA_TYPE_UNION, FIELD_DATA_TYPE_ENUM]
  common.ThresholdBy:
    trimPrefix: THRESHOLD_BY_
    zero: unspecified
    values: [THRESHOLD_BY_VALUE, THRESHOLD_BY_BACKGROUND]
  Visualization.BarValueDisplay:
    trimPrefix: BAR_VALUE_DISPLAY_
    zero: unspecified
    values: [BAR_VALUE_DISPLAY_TOP, BAR_VALUE_DISPLAY_INSIDE, BAR_VALUE_DISPLAY_BOTH]
  Visualization.StackedLine:
    trimPrefix: STACKED_LINE_
    zero: unspecified
    values: [STACKED_LINE_ABSOLUTE, STACKED_LINE_RELATIVE]
  TooltipType:
    trimPrefix: TOOLTIP_TYPE_
    zero: unspecified
    values: [TOOLTIP_TYPE_ALL, TOOLTIP_TYPE_SINGLE]
  VariableSourceV2.RefreshStrategy:
    trimPrefix: REFRESH_STRATEGY_
    zeroNull: true
    values: [REFRESH_STRATEGY_ON_DASHBOARD_LOAD, REFRESH_STRATEGY_ON_TIME_FRAME_CHANGE]
  VariableDisplayTypeV2:
    trimPrefix: VARIABLE_DISPLAY_TYPE_V2_
    zero: unspecified
    values: [VARIABLE_DISPLAY_TYPE_V2_LABEL_VALUE, VARIABLE_DISPLAY_TYPE_V2_VALUE, VARIABLE_DISPLAY_TYPE_V2_NOTHING]
  Visualization.PieChart.LabelSource:
    trimPrefix: LABEL_SOURCE_
    zero: unspecified
    values: [LABEL_SOURCE_INNER, LABEL_SOURCE_STACK]
  Weekday:
    trimPrefix: WEEKDAY_
    zero: unspecified
    values: [WEEKDAY_MONDAY, WEEKDAY_TUESDAY, WEEKDAY_WEDNESDAY, WEEKDAY_THURSDAY, WEEKDAY_FRIDAY, WEEKDAY_SATURDAY, WEEKDAY_SUNDAY]
  Interpretation:
    trimPrefix: INTERPRETATION_
    zero: unspecified
    values: [INTERPRETATION_RAW_DATA_TABLE, INTERPRETATION_TREND_OVER_TIME_LINE, INTERPRETATION_SINGLE_VALUE_KPI, INTERPRETATION_MULTI_VALUE_KPI, INTERPRETATION_CATEGORICAL_ANALYSIS_VERTICAL_BARS, INTERPRETATION_SINGLE_VALUE_KPI_STAT, INTERPRETATION_SINGLE_VALUE_KPI_GAUGE, INTERPRETATION_MULTI_VALUE_KPI_STAT, INTERPRETATION_MULTI_VALUE_KPI_GAUGE, INTERPRETATION_MULTI_VALUE_KPI_HEXAGON_BINS, INTERPRETATION_CATEGORICAL_ANALYSIS_PIE_CHART, INTERPRETATION_CATEGORICAL_ANALYSIS_HORIZONTAL_BARS, INTERPRETATION_SINGLE_VALUE_KPI_STAT_CARD, INTERPRETATION_MULTI_VALUE_KPI_STAT_CARD]
  Gauge.ThresholdBy:
    trimPrefix: THRESHOLD_BY_
    zero: unspecified
    values: [THRESHOLD_BY_VALUE, THRESHOLD_BY_BACKGROUND]
  Gauge.Unit:
    trimPrefix: UNIT_
    names: {UNIT_NUMBER: none, UNIT_EUR: euro, UNIT_EUR_CENTS: euro_cents, UNIT_PERCENT_ZERO_ONE: percent01, UNIT_PERCENT_ZERO_HUNDRED: percent100}
    zero: unspecified
    values: [UNIT_NUMBER, UNIT_PERCENT, UNIT_MICROSECONDS, UNIT_MILLISECONDS, UNIT_SECONDS, UNIT_BYTES, UNIT_KBYTES, UNIT_MBYTES, UNIT_GBYTES, UNIT_BYTES_IEC, UNIT_KIBYTES, UNIT_MIBYTES, UNIT_GIBYTES, UNIT_EUR_CENTS, UNIT_EUR, UNIT_USD_CENTS, UNIT_USD, UNIT_CUSTOM, UNIT_PERCENT_ZERO_ONE, UNIT_PERCENT_ZERO_HUNDRED, UNIT_NANOSECONDS, UNIT_DATETIME_ISO]
  widgets.PieChart.LabelSource:
    trimPrefix: LABEL_SOURCE_
    zero: unspecified
    values: [LABEL_SOURCE_INNER, LABEL_SOURCE_STACK]
  MetricAggregationType:
    zero: unspecified
    trimPrefix: METRIC_AGGREGATION_TYPE_
    names: {METRIC_AGGREGATION_TYPE_AVERAGE: avg}
    values: [METRIC_AGGREGATION_TYPE_MIN, METRIC_AGGREGATION_TYPE_MAX, METRIC_AGGREGATION_TYPE_AVERAGE, METRIC_AGGREGATION_TYPE_SUM, METRIC_AGGREGATION_TYPE_PERCENTILE_99, METRIC_AGGREGATION_TYPE_PERCENTILE_95, METRIC_AGGREGATION_TYPE_PERCENTILE_50]
  DimensionAggregationType:
    zero: unspecified
    trimPrefix: DIMENSION_AGGREGATION_TYPE_
    values: [DIMENSION_AGGREGATION_TYPE_UNIQUE_COUNT, DIMENSION_AGGREGATION_TYPE_ERROR_COUNT]
  MetadataField:
    zero: unspecified
    trimPrefix: METADATA_FIELD_
    values: [METADATA_FIELD_APPLICATION_NAME, METADATA_FIELD_SUBSYSTEM_NAME, METADATA_FIELD_SERVICE_NAME, METADATA_FIELD_OPERATION_NAME]
  VariableDisplayType:
    zeroNull: true
    trimPrefix: VARIABLE_DISPLAY_TYPE_
    values: [VARIABLE_DISPLAY_TYPE_LABEL_VALUE, VARIABLE_DISPLAY_TYPE_VALUE, VARIABLE_DISPLAY_TYPE_NOTHING]
  SectionPredefinedColor:
    trimPrefix: SECTION_PREDEFINED_COLOR_
    zeroNull: true
    values: [SECTION_PREDEFINED_COLOR_CYAN, SECTION_PREDEFINED_COLOR_GREEN, SECTION_PREDEFINED_COLOR_BLUE, SECTION_PREDEFINED_COLOR_PURPLE, SECTION_PREDEFINED_COLOR_MAGENTA, SECTION_PREDEFINED_COLOR_PINK, SECTION_PREDEFINED_COLOR_ORANGE]
  DimensionField:
    trimPrefix: DIMENSION_FIELD_
    zero: unspecified
    values: [DIMENSION_FIELD_TRACE_ID]
  MetricAggregation.MetricField:
    trimPrefix: METRIC_FIELD_
    zero: unspecified
    values: [METRIC_FIELD_DURATION]
  SelectionType:
    trimPrefix: SELECTION_TYPE_
    zeroNull: true
    values: [SELECTION_TYPE_MULTI, SELECTION_TYPE_SINGLE]
    rejected: [SELECTION_TYPE_MULTI_ALL]
    readRejectedAs: "null"
  v1.common.DataModeType@annotation:
    trimPrefix: DATA_MODE_TYPE_
    zero: unspecified
    values: [DATA_MODE_TYPE_ARCHIVE]
# Metrics operators: unwrap Selection + ListSelection, so each arm is an object with one list (risk 1).
unwrap: [LogsPathSource, FolderPath, LuceneQuery, UUID, SectionColor, Constant, ConstantListSource, SpanFieldSource, PromQlQuery, common.DataprimeQuery, Query.MetricsQuery.Selection, Query.MetricsQuery.Selection.ListSelection, QuerySource.MetricsQuery.Selection, QuerySource.MetricsQuery.Selection.ListSelection]

groups:
  folder:
    fields: [folderId, folderPath]
    optional: true
    keepPriorArm: true
    markdownDescription: The dashboards folder this dashboard belongs to. Exactly one of `id` or `path` is set.
  time_frame:
    fields: [absoluteTimeFrame]
    optional: true
    requireOne: true
    markdownDescription: Specifies the time frame. Can be either absolute or relative.
    groups:
      relative: {fields: [relativeTimeFrame], optional: true}
  auto_refresh:
    fields: [off, oneMinute, twoMinutes, fiveMinutes, fifteenMinutes]
    optional: true
    computed: true
    typedArms: {field: type, default: off}

types:
  Dashboard:
    fields:
      id: {readOnly: true}
      absoluteTimeFrame: {name: absolute}
      relativeTimeFrame: {name: duration, required: true, durationFormat: protoText}
      actions:
        distributeTo:
          item: Widget
          as: custom_actions
          by: {listField: widgetId, itemField: id}
          keep: definition.customAction
        validators:
        - {sizeAtLeast: 1}
      name: {schemaOptional: true}
      layout: {schemaOptional: true}
      annotations:
        validators:
        - {sizeAtLeast: 1}
        readEmptyAs: 'null'
      filters:
        validators:
        - {sizeAtLeast: 1}
        readEmptyAs: 'null'
      variables:
        validators:
        - {sizeAtLeast: 1}
        deprecation: Use `variables_v2` for new dashboard variables. This legacy attribute remains available during migration.
        readEmptyAs: 'null'
      variablesV2:
        validators:
        - {sizeAtLeast: 1}
        readEmptyAs: 'null'
      folderId:
        name: id
        validators:
        - exactlyOneOf: [path]
        markdownDescription: 'ID of the dashboards folder this dashboard belongs to. When authoring a `coralogix_dashboard` resource, this is the lifecycle-safe choice: reference a `coralogix_dashboards_folder` resource''s `id` so the folder is created and destroyed by Terraform alongside the dashboard.'
      folderPath: {name: path}
      slugName: {skip: true}
    extraAttributes:
      content_json:
        type: string
        inUpdate: true
        markdownDescription: An option to set the dashboard content from a json file. It excludes every other attribute of the dashboard, except `folder`, `auto_refresh`, and `access_policy`.
        validators:
        - conflictsWith: [id, name, description, layout, variables, variables_v2, filters, time_frame, annotations]
        - exactlyOneOf: [layout]
      access_policy: {type: string, optional: true, computed: true, equality: json, useStateForUnknown: true, markdownDescription: JSON-encoded access policy for this dashboard., inUpdate: true}
  LogsAggregation: {typedArms: {names: {average: avg}}}
  SpansAggregation: {typedArms: {names: {metricAggregation: metric, dimensionAggregation: dimension}}}
  Filter.Operator: {typedArms: {names: {notEquals: not_equals}}}
  Equals.Selection: {typedArms: {field: selection_type, infer: true}}
  NotEquals.Selection: {typedArms: {field: selection_type, infer: true}}
  Equals.Selection.ListSelection: {fields: {values: {name: selected_values, computed: true, default: []}}}
  NotEquals.Selection.ListSelection: {fields: {values: {name: selected_values, computed: true, default: []}}}
  SpanField: {typedArms: {names: {metadataField: metadata, tagField: tag, processTagField: process_tag}}, fields: {metadataField: {required: true}}}
  Query.MetricsQuery.Operator: {typedArms: {names: {notEquals: not_equals}}}
  Query.MetricsQuery.NotEquals: {fields: {selection: {name: selected_values, requireOne: true, readEmptyAs: 'null'}}}
  QuerySource.MetricsQuery.Operator: {typedArms: {names: {notEquals: not_equals}}}
  QuerySource.MetricsQuery.NotEquals: {fields: {selection: {name: selected_values, requireOne: true, readEmptyAs: 'null'}}}
  Query.MetricsQuery.Equals: {fields: {selection: {name: selected_values, requireOne: true, readEmptyAs: 'null'}}}
  QuerySource.MetricsQuery.Equals: {fields: {selection: {name: selected_values, requireOne: true, readEmptyAs: 'null'}}}
  Query.MetricsQuery.Type.LabelValue: {fields: {labelFilters: {readEmptyAs: 'null'}, labelName: {requireOne: true}, metricName: {requireOne: true}}}
  QuerySource.MetricsQuery.Type.LabelValue: {fields: {labelFilters: {readEmptyAs: 'null'}, labelName: {requireOne: true}, metricName: {requireOne: true}}}
  TimeFrame: {fields: {from: {name: start, required: true}, to: {name: end, required: true}}}
  # R25: the relative arm, a plain duration, is an object: relative = { duration }.
  TimeFrameSelect:
    groups:
      relative:
        fields: [relativeTimeFrame]
        optional: true
    fields:
      absoluteTimeFrame: {name: absolute}
      relativeTimeFrame: {name: duration, required: true, durationFormat: protoText}
  BarChart.Query: {fields: {dataprime: {name: data_prime}}}
  BarChart.DataprimeQuery: {fields: {dataprimeQuery: {name: query, required: true}, filters: {requireOne: true}, timeFrame: {requireOne: true}}}
  DataTable.Query: {fields: {dataprime: {name: data_prime}}}
  DataTable.DataprimeQuery: {fields: {dataprimeQuery: {name: query}, filters: {requireOne: true}, timeFrame: {requireOne: true}}}
  Gauge.Query: {fields: {dataprime: {name: data_prime}}}
  Gauge.DataprimeQuery: {fields: {dataprimeQuery: {name: query}, filters: {requireOne: true}, timeFrame: {requireOne: true}}}
  Hexagon.Query: {fields: {dataprime: {name: data_prime}}}
  Hexagon.DataprimeQuery: {fields: {dataprimeQuery: {name: query}, filters: {requireOne: true}, timeFrame: {requireOne: true}}}
  HorizontalBarChart.Query: {fields: {dataprime: {name: data_prime}}}
  HorizontalBarChart.DataprimeQuery: {fields: {dataprimeQuery: {name: query, required: true}, filters: {requireOne: true}, timeFrame: {requireOne: true}}}
  LineChart.Query: {fields: {dataprime: {name: data_prime}}}
  LineChart.DataprimeQuery: {fields: {dataprimeQuery: {name: query}, filters: {requireOne: true}, timeFrame: {requireOne: true}}}
  PieChart.Query: {fields: {dataprime: {name: data_prime}}}
  PieChart.DataprimeQuery: {fields: {dataprimeQuery: {name: query, required: true}, filters: {requireOne: true}, timeFrame: {requireOne: true}}}
  Dynamic.Query: {fields: {dataprime: {name: data_prime}}}
  Dataprime: {fields: {dataprimeQuery: {name: query}, dataModeType: {computed: true, default: unspecified, validators: [{enum: true}]}}}
  widgets.Dynamic:
    fields:
      queryDefinitions:
        required: true
        validators:
        - {sizeAtLeast: 1}
      interpretation:
        computed: true
        default: unspecified
        validators:
        - {enum: true}
        deprecation: 'Deprecated: superseded by the visualization block.'
      timeFrame: {requireOne: true}
      visualization:
        requireOne: true
        unsupportedIfEmpty: {summary: Unsupported Dashboard Widget Definition, detail: The dynamic widget uses a visualization variant this provider version cannot represent as typed HCL. Manage this dashboard with `content_json` until that visualization is supported.}
    unsupportedArms: [query]
    unsupportedSummary: Unsupported Dashboard Widget Definition
    unsupportedDetail: The dynamic widget uses the deprecated top-level `query`, which this provider cannot represent as typed HCL. Manage this dashboard with `content_json`, or move the widget to `query_definitions`, which holds the same queries.
  Gauge.LogsQuery:
    fields:
      aggregation: {skip: true}
      logsAggregation: {required: true}
      filters:
        validators:
        - {sizeAtLeast: 1}
      groupBy:
        validators:
        - {sizeAtLeast: 1}
      timeFrame: {requireOne: true}
  Gauge.SpansQuery:
    fields:
      aggregation: {skip: true}
      filters:
        validators:
        - {sizeAtLeast: 1}
      groupBy:
        validators:
        - {sizeAtLeast: 1}
      groupBys:
        validators:
        - {sizeAtLeast: 1}
      timeFrame: {requireOne: true}
  Hexagon.LogsQuery: {fields: {logsAggregation: {name: aggregation, required: true}, filters: {validators: [{sizeAtLeast: 1}]}, timeFrame: {requireOne: true}}}
  Hexagon.SpansQuery:
    fields:
      spansAggregation: {name: aggregation}
      filters:
        validators:
        - {sizeAtLeast: 1}
      groupBys:
        validators:
        - {sizeAtLeast: 1}
      timeFrame: {requireOne: true}
  Logs:
    fields:
      aggregation:
        name: aggregations
        validators:
        - {sizeAtLeast: 1}
      dataModeType:
        computed: true
        default: unspecified
        validators:
        - {enum: true}
      filters:
        validators:
        - {sizeAtLeast: 1}
      groupBy:
        validators:
