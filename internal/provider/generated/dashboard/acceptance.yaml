# What the generated acceptance test needs for coralogix_dashboard, besides the schema.
#
# The full test makes one dashboard with one widget kind: the generator sets the first arm of each
# oneOf group, so it is a bar chart. The values-and-choices subtest sets the other widget kinds and
# every other enum value, and the handwritten acceptance tests cover more.
resource: Dashboard

prerequisites: |
  resource "coralogix_dashboards_folder" "folder" {
    name = "@{run}-folder"
  }

values:
  layout.sections[].rows[].widgets[].definition.bar_chart.decimal: "1"
  layout.sections[].rows[].widgets[].definition.bar_chart.scale_type: '"linear"'
  # The API wants min below max.
  layout.sections[].rows[].widgets[].definition.bar_chart.y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.bar_chart.y_axis_max: "2"
  # A duration as the API writes it: the API rejects other text.
  layout.sections[].rows[].widgets[].definition.bar_chart.xaxis.time_buckets.auto.minimum_interval: '"60s"'
  # The API allows true only for a textbox variable.
  variables_v2[].display_full_row: "false"
  # DataPrime queries that compile.
  variables_v2[].source.query.dataprime_query.type.query_text.query: '"source logs | limit 1"'
  annotations[].source.dataprime.query: '"source logs | limit 1"'
  layout.sections[].rows[].widgets[].definition.bar_chart.query.data_prime.query: '"source logs | limit 1"'
  # Text that the API reads: a unit, a scale, and durations in the forms of the API.
  layout.sections[].rows[].widgets[].definition.pie_chart.unit: '"bytes"'
  layout.sections[].rows[].widgets[].definition.horizontal_bar_chart.scale_type: '"linear"'
  time_frame.relative.duration: '"seconds:3600"'
  layout.sections[].rows[].widgets[].definition.dynamic.time_frame.relative.duration: '"seconds:3600"'
  annotations[].source.event_recurrence.strategy.duration.duration: '"60s"'
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].resolution.interval: '"seconds:60"'
  # The API wants a minimum below the maximum.
  layout.sections[].rows[].widgets[].definition.gauge.min: "1"
  layout.sections[].rows[].widgets[].definition.gauge.max: "2"
  layout.sections[].rows[].widgets[].definition.hexagon.min: "1"
  layout.sections[].rows[].widgets[].definition.hexagon.max: "2"
  layout.sections[].rows[].widgets[].definition.horizontal_bar_chart.y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.horizontal_bar_chart.y_axis_max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.gauge.min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.gauge.max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.hexagon_bins.min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.hexagon_bins.max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.stat.min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.stat.max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.horizontal_bars.y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.horizontal_bars.y_axis_max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.horizontal_bars_multi.y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.horizontal_bars_multi.y_axis_max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.vertical_bars.y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.vertical_bars.y_axis_max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.vertical_bars_multi.y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.vertical_bars_multi.y_axis_max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.geomap.min_max.custom.min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.geomap.min_max.custom.max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.table.rules[].properties[].definition.thresholds.min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.table.rules[].properties[].definition.thresholds.max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.table.rules[].properties[].definition.units.min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.table.rules[].properties[].definition.units.max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.time_series_bars.y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.time_series_bars.y_axis_max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.time_series_lines.y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.time_series_lines.y_axis_max: "2"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.time_series_lines_multi.query_display_settings[].y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.dynamic.visualization.time_series_lines_multi.query_display_settings[].y_axis_max: "2"
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].y_axis_min: "1"
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].y_axis_max: "2"
  # A query takes up to two different span relation types. The group fields all use root, and a
  # filter list has one element, so a query has two types at most. The filters still set every value.
  layout.sections[].rows[].widgets[].definition.bar_chart.query.spans.group_names_fields[].relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.bar_chart.query.spans.stacked_group_name_field.relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.data_table.query.spans.grouping.group_bys[].relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.dynamic.query_definitions[].query.spans.group_by[].relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.gauge.query.spans.group_bys[].relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.hexagon.query.spans.group_bys[].relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.horizontal_bar_chart.query.spans.group_names_fields[].relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.horizontal_bar_chart.query.spans.stacked_group_name_field.relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].query.spans.group_bys[].relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.pie_chart.query.spans.group_names_fields[].relation_type: '"root"'
  layout.sections[].rows[].widgets[].definition.pie_chart.query.spans.stacked_group_name_field.relation_type: '"root"'
  # A spans field value has an observation field or a value, not both.
  # DataPrime queries that compile, in every widget kind.
  layout.sections[].rows[].widgets[].definition.data_table.query.data_prime.query: '"source logs | limit 1"'
  layout.sections[].rows[].widgets[].definition.dynamic.query_definitions[].query.data_prime.query: '"source logs | limit 1"'
  layout.sections[].rows[].widgets[].definition.gauge.query.data_prime.query: '"source logs | limit 1"'
  layout.sections[].rows[].widgets[].definition.hexagon.query.data_prime.query: '"source logs | limit 1"'
  layout.sections[].rows[].widgets[].definition.horizontal_bar_chart.query.data_prime.query: '"source logs | limit 1"'
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].query.data_prime.query: '"source logs | limit 1"'
  layout.sections[].rows[].widgets[].definition.pie_chart.query.data_prime.query: '"source logs | limit 1"'
  # A folder of the tenant.
  folder.id: coralogix_dashboards_folder.folder.id

updatedValues:
  variables_v2[].display_full_row: "false"
  layout.sections[].rows[].widgets[].definition.bar_chart.y_axis_min: "2"
  layout.sections[].rows[].widgets[].definition.bar_chart.y_axis_max: "3"
  layout.sections[].rows[].widgets[].definition.bar_chart.xaxis.time_buckets.auto.minimum_interval: '"120s"'

minimal:
  - name
  - layout.sections[].rows[].widgets[].definition
  - layout.sections[].rows[].widgets[].title

skip:
  # The API refuses a relation type in a global filter (other, root): it works in widget filters only.
  # The widgets still set every value.
  - filters[].source.spans.observation_field.relation_type
  # The primary value of a stat card is the source of the mapping: the API refuses mapped values in it.
  - layout.sections[].rows[].widgets[].definition.dynamic.visualization.stat_card.primary_value.template_variables[].mapped_values
  # The legacy span field value is refused next to an observation field.
  - variables_v2[].source.query.spans_query.type.field_value.value
  # The legacy variables are deprecated, and the API rejects constant_value: variables_v2 covers them.
  - variables
  # content_json replaces every typed attribute: the handwritten tests cover it.
  - content_json
  # The folder is the id above or a path.
  - folder.path
  # The server makes the ids when the configuration leaves them out.
  - annotations[].id
  - filters[].id
  - variables_v2[].id
  # A widget has a definition or a reference to a widget of another dashboard, not both.
  - layout.sections[].rows[].widgets[].reference
  - layout.sections[].id
  - layout.sections[].rows[].id
  - layout.sections[].rows[].widgets[].id
  # The time block of the x axis is deprecated: the UI rewrites it to time_buckets.
  - layout.sections[].rows[].widgets[].definition.bar_chart.xaxis.time
  # collapsed and internal exclude each other.
  - layout.sections[].options.internal
  # A widget scope is all_widgets or specific_widgets, not both: the API rejects both.
  - annotations[].scope.specific_widgets
  - filters[].scope.specific_widgets
  # With selection_type all, the operator has no selected values.
  - filters[].source.logs.operator.selected_values
  - layout.sections[].rows[].widgets[].definition.bar_chart.query.data_prime.filters[].logs.operator.selected_values

# A query takes up to two different span relation types, so a filter list has one element. The API
# takes one aggregation in the logs and spans query of a line chart (400: aggregations should
# contain a single element). The values-and-choices subtest puts one in a query, and the other
# values in copies.
maxElements:
  layout.sections[].rows[].widgets[].definition.bar_chart.query.spans.filters: 1
  layout.sections[].rows[].widgets[].definition.data_table.query.spans.filters: 1
  layout.sections[].rows[].widgets[].definition.dynamic.query_definitions[].query.spans.filters: 1
  layout.sections[].rows[].widgets[].definition.gauge.query.spans.filters: 1
  layout.sections[].rows[].widgets[].definition.hexagon.query.spans.filters: 1
  layout.sections[].rows[].widgets[].definition.horizontal_bar_chart.query.spans.filters: 1
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].query.spans.filters: 1
  layout.sections[].rows[].widgets[].definition.pie_chart.query.spans.filters: 1
  layout.sections[].rows[].widgets[].definition.bar_chart.query.data_prime.filters: 1
  layout.sections[].rows[].widgets[].definition.data_table.query.data_prime.filters: 1
  layout.sections[].rows[].widgets[].definition.gauge.query.data_prime.filters: 1
  layout.sections[].rows[].widgets[].definition.hexagon.query.data_prime.filters: 1
  layout.sections[].rows[].widgets[].definition.horizontal_bar_chart.query.data_prime.filters: 1
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].query.data_prime.filters: 1
  layout.sections[].rows[].widgets[].definition.pie_chart.query.data_prime.filters: 1
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].query.logs.aggregations: 1
  layout.sections[].rows[].widgets[].definition.line_chart.query_definitions[].query.spans.aggregations: 1
  layout.sections[].rows[].widgets[].definition.dynamic.query_definitions[].query.logs.aggregations: 1
  layout.sections[].rows[].widgets[].definition.dynamic.query_definitions[].query.spans.aggregations: 1
