# What the generated acceptance test needs for coralogix_alerts_scheduler, besides the schema.
resource: AlertSchedulerRule

values:
  name: '"@{run}-scheduler"'
  filter.what_expression: '"source logs | filter true"'
  schedule.operation: '"mute"'
  schedule.one_time.time_frame.start_time: '"2030-01-01T00:00:00.000"'
  schedule.one_time.time_frame.time_zone: '"UTC+0"'
  # The API takes only a time without a zone, and the end must come after the start.
  schedule.one_time.time_frame.end_time: '"2030-01-02T00:00:00.000"'
  schedule.recurring.dynamic.termination_date: '"2031-01-01T00:00:00.000"'
  schedule.recurring.dynamic.time_frame.start_time: '"2030-01-01T00:00:00.000"'
  # The API answers 500 to the delete of a recurring schedule with a duration in days. It accepts
  # the create, the update, and the delete of a duration in minutes or hours, and of a one-time
  # schedule in days. The one-time schedule still sets every duration frequency.
  schedule.recurring.dynamic.time_frame.duration.frequency: '"hours"'
  # The time zone is a fixed list of text values, so a new value needs no config of its own. The
  # API answered 500 to an update of a recurring schedule to UTC-6 and accepted the other values.
  schedule.recurring.dynamic.time_frame.time_zone: '"UTC"'
  schedule.recurring.dynamic.time_frame.end_time: '"2030-01-02T00:00:00.000"'
  # The API never deletes a meta label and limits them per tenant; at the limit it silently drops
  # a new label. A fixed label adds none, so the test does not fill the limit.
  meta_labels[].key: '"key"'
  meta_labels[].value: '"value"'
  filter.meta_labels[].key: '"key"'
  filter.meta_labels[].value: '"value"'

# The API rejects an alert id that does not exist, so the tests select alerts by meta label.
skip:
  - filter.alerts_unique_ids

upgradeFrom: "3.21.0"

skipTests:
  values-and-choices: >-
    Temporarily skipped: delete returns HTTP 500. Re-enable after the API failure is investigated.
