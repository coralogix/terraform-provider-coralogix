# Where coralogix_archive_metrics differs from the API contract, because users already have it.
#
# A field with a line here keeps its released behavior. A field without a line follows the API
# contract.
resource: TenantConfigV2
mode: existing
typeName: archive_metrics

markdownDescription: "Coralogix archive-metrics. Configures the S3/IBM bucket Coralogix archives metrics into. For more info please review - https://coralogix.com/docs/user-guides/data-flow/s3-archive/connect-s3-archive/."

schema:
  version: 0

validators:
  inferred: false

# The released id of the one metrics archive of the company.
singletonID: {fixed: archive-metrics-settings}

api:
  # The API has one metrics archive per company. POST creates and replaces it, and GET reads it.
  # It cannot be removed, so destroy only removes it from the state.
  operations:
    create: MetricsConfiguratorPublicService_ConfigureTenant
    get: MetricsConfiguratorPublicService_GetTenantConfig
    update: MetricsConfiguratorPublicService_ConfigureTenant
    delete: none

# The released data source reads the one metrics archive. It takes no input.
dataSource: {}

types:
  TenantConfigV2:
    # The released resource configures S3 and IBM only.
    unsupportedArms: [gcs]
    unsupportedSummary: "Error reading coralogix_archive_metrics"
    unsupportedDetail: "the tenant configuration uses an unsupported storage backend; only IBM and S3 are supported"
    fields:
      # Set by the enable and disable calls, which the resource does not make.
      disabled:
        skip: true
      s3:
        requireOne: true
        markdownDescription: ""
      ibm:
        requireOne: true
        markdownDescription: ""
      prefix:
        useStateForUnknown: true
        markdownDescription: ""
      tenantId:
        useStateForUnknown: true
        markdownDescription: ""
      retentionPolicy:
        computed: true # released: the plan keeps the policy in state when the configuration has none
        useStateForUnknown: true
        markdownDescription: "The retention policy (in days) for the archived metrics. Having default values when not specified."
  S3Config:
    fields:
      bucket:
        required: true
        markdownDescription: "The bucket name to store the archived metrics in."
      region:
        required: true
        markdownDescription: "The bucket region. see - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.RegionsAndAvailabilityZones.html#Concepts.RegionsAndAvailabilityZones.Regions"
  IbmConfigV2:
    fields:
      crn:
        required: true
        markdownDescription: ""
      endpoint:
        required: true
        markdownDescription: ""
      # The released resource does not manage it.
      serviceCrn:
        skip: true
  RetentionPolicyRequest:
    fields:
      rawResolution:
        required: true
        markdownDescription: ""
      fiveMinutesResolution:
        required: true
        markdownDescription: ""
      oneHourResolution:
        required: true
        markdownDescription: ""
